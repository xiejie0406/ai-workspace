[build-system]
requires = ["setuptools==70.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paiflow-runtime"
version = "0.1.0"
description = "PaiFlow 中心租约驱动的独立 Python 执行边界"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
paiflow-worker = "worker.__main__:main"

[project.optional-dependencies]
pure = ["pydantic==2.9.2", "jsonschema==4.23.0", "loguru==0.7.2"]
model-codecs = ["pydantic==2.9.2", "jsonschema==4.23.0", "loguru==0.7.2", "websockets==12.0", "tenacity==9.1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*", "workflow*", "agent*", "plugin*", "common*", "knowledge*", "sandbox*"]
exclude = ["tests*", "scripts*", "upstream-dependencies*"]
namespaces = true

[tool.paiflow]
status = "original-engine-with-controlled-node-adapters-full-capability-port-incomplete"
source = "参考项目/PaiFlow-main/core"
upstream-dependency-baselines = [
  "upstream-dependencies/workflow/pyproject.toml",
  "upstream-dependencies/agent/pyproject.toml",
  "upstream-dependencies/plugin/link/pyproject.toml",
  "upstream-dependencies/plugin/aitools/pyproject.toml",
  "upstream-dependencies/common/pyproject.toml",
]
# 包入口不自动混装上游依赖。原算法分别使用各自 SDK，五套上游环境存在
# 冲突的版本约束，尚未合并成一个可安装锁；保留每个原锁，禁止静默升级。

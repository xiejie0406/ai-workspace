[project]
name = "ruoyi-aipicture-runtime"
version = "0.1.0"
description = "若依 AI 图片编辑独立计算 Worker，无业务数据库和账号状态"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "pillow>=11,<13",
  "langgraph>=1,<2", "langchain-core>=1,<2", "langchain-openai>=1,<2", "numpy>=2,<3",
]

[project.optional-dependencies]
cv = ["rembg>=2,<3", "onnxruntime>=1.20,<2", "opencv-python>=4.10,<6", "rapidocr-onnxruntime>=1.4,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aipicture_runtime"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

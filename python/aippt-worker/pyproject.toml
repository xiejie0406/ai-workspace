[project]
name = "ruoyi-aippt-worker"
version = "0.1.0"
description = "若依 AI 演示文稿私有算法 Worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "python-pptx==1.0.2",
    "markdown-it-py==4.2.0",
    "python-docx==1.2.0",
    "pdfplumber==0.11.10",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.3",
    "langgraph==1.2.10",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "certifi==2026.7.22",
    # requests/LangSmith 的传递依赖安全修复；wheel 安装也须拒绝旧版。
    "urllib3==2.8.0",
    "fonttools==4.63.0",
    "pillow==12.3.0",
]

[project.scripts]
aippt-worker = "app.worker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"regression" = "regression"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "reportlab==5.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

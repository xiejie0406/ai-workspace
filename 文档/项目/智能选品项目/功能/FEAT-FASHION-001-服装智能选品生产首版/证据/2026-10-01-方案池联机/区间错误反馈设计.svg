<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460">
<rect width="1000" height="460" fill="#f5f7fa"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#303133">
<text x="30" y="40" font-size="22" font-weight="bold">套装选品：筛选区间错误与修正（设计图）</text>
<text x="30" y="70" font-size="14">入口：智能选品 → 套装选品 → 商品筛选；保留原有横版筛选和三步导航</text>
<rect x="30" y="100" width="445" height="270" rx="10" fill="white" stroke="#dcdfe6"/>
<text x="50" y="130" font-size="18">品类1 · 错误区间</text>
<text x="50" y="167" font-size="14">三级分类（多选）</text><rect x="190" y="147" width="250" height="32" rx="4" fill="#f2f6fc"/>
<text x="205" y="170" font-size="14">合成验收 / 服装 / 上装</text>
<text x="50" y="212" font-size="14">团购价区间</text>
<rect x="190" y="189" width="100" height="36" rx="4" fill="white" stroke="#f56c6c"/><text x="206" y="213" font-size="16">200</text>
<text x="303" y="214" font-size="15">至</text><rect x="336" y="189" width="104" height="36" rx="4" fill="white" stroke="#f56c6c"/><text x="351" y="213" font-size="16">100</text>
<text x="190" y="249" font-size="14" fill="#c53030">团购价下限不能大于上限</text>
<text x="50" y="289" font-size="14">VIP价与可售数量区间同样就地提示</text>
<rect x="50" y="311" width="180" height="36" rx="4" fill="#409eff"/><text x="85" y="336" font-size="14" fill="white">生成方案池</text>
<text x="243" y="335" font-size="12" fill="#c53030">提交时保留输入、提示修正</text>
<path d="M 485 233 H 513" stroke="#409eff" stroke-width="3"/><path d="M 506 226 L 515 233 L 506 240" fill="none" stroke="#409eff" stroke-width="3"/>
<rect x="525" y="100" width="445" height="270" rx="10" fill="white" stroke="#dcdfe6"/>
<text x="545" y="130" font-size="18">品类1 · 修正后</text>
<text x="545" y="167" font-size="14">三级分类（多选）</text><rect x="685" y="147" width="250" height="32" rx="4" fill="#f2f6fc"/>
<text x="700" y="170" font-size="14">合成验收 / 服装 / 上装</text>
<text x="545" y="212" font-size="14">团购价区间</text>
<rect x="685" y="189" width="100" height="36" rx="4" fill="white" stroke="#dcdfe6"/><text x="701" y="213" font-size="16">100</text>
<text x="798" y="214" font-size="15">至</text><rect x="831" y="189" width="104" height="36" rx="4" fill="white" stroke="#dcdfe6"/><text x="846" y="213" font-size="16">200</text>
<text x="685" y="249" font-size="14" fill="#328450">错误自动消失，其他组条件不变</text>
<text x="545" y="289" font-size="14">清空一侧仍允许单边范围；0为有效值</text>
<rect x="545" y="311" width="180" height="36" rx="4" fill="#409eff"/><text x="580" y="336" font-size="14" fill="white">生成方案池</text>
<text x="738" y="335" font-size="12">通过客户端校验后由Java裁决</text>
<text x="30" y="410" font-size="14">整套总价区间采用相同反馈；原API、权限、价格口径、范围守卫与服务端校验保持原行为。</text>
<text x="30" y="437" font-size="13" fill="#606266">依据：已批准的方案池交互设计第4节“范围错误就地反馈”；此图用于设计，不是验收截图。</text>
</g></svg>

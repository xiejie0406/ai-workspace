<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} .small{font-size:14px;fill:#60718a} .bold{font-weight:700} .title{font-size:26px;font-weight:700} .legacy text{font-size:16px;fill:#24364b} .legacy .small{font-size:14px;fill:#60718a} .legacy .title{font-size:26px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1160" rx="0" fill="#eef3f8" stroke="#dce5ef"/><rect x="0" y="0" width="1440" height="66" rx="0" fill="#152b49" stroke="#dce5ef"/><text x="24" y="41" font-size="22" fill="#fff" font-weight="700">智能选品</text><text x="165" y="39" font-size="16" fill="#fff" font-weight="400">商品资料</text><text x="297" y="39" font-size="16" fill="#fff" font-weight="400">资料导入</text><text x="429" y="39" font-size="16" fill="#fff" font-weight="400">仓库管理</text><text x="561" y="39" font-size="16" fill="#fff" font-weight="400">库存中心</text><text x="693" y="39" font-size="16" fill="#fff" font-weight="400">客户需求</text><rect x="815" y="12" width="118" height="42" rx="7" fill="#216be8" stroke="#216be8"/><text x="825" y="39" font-size="16" fill="#fff" font-weight="400">选品方案</text><text x="957" y="39" font-size="16" fill="#fff" font-weight="400">AI任务</text><text x="1089" y="39" font-size="16" fill="#fff" font-weight="400">提案交付</text><text x="1265" y="39" font-size="14" fill="#dbe6f5" font-weight="400">管理设置</text><text x="24" y="111" font-size="26" fill="#24364b" font-weight="700">条件复用与联动：隐藏保留，字段分别跟随</text><text x="24" y="144" font-size="14" fill="#60718a" font-weight="400">设计稿1.2 · 合成样例 · 顶部业务导航 · 价格/图片归商品资料 · 非生产验收</text><g class="legacy" transform="translate(-188.4 110) scale(1.13 1)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="105" width="1225" height="220" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="143" class="bold">三组模式：A / B / C</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="185" class="">第1组：上装 · 品号 A001 · 仓库跟随 · 需求100跟随</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="227" class="">第2组：下装 · 货号 B002 · 仓库跟随 · 需求100跟随</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="269" class="">第3组：鞋类 · 主SKU C003 · 仓库独立NORTH · 需求120独立</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="345" width="1225" height="220" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="383" class="bold">切换二组：前两组原样使用</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="425" class="">第1组 A001 / 第2组 B002：分类、编码、价格、数量均不重填。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="467" class="">第3组 C003：隐藏并保留草稿，不进入本次查询或计数。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="509" class="">切回三组：原分类、独立仓库与独立需求120恢复。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="585" width="1225" height="220" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="623" class="bold">总条件100 → 150：只更新跟随字段</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="665" class="">第1组需求：100 → 150，来源：总条件。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="707" class="">第2组需求：100 → 150，来源：总条件。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="749" class="">第3组需求：120 → 120，来源：独立；可点击恢复跟随变150。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="825" width="1225" height="162" rx="12" fill="#e9f2ff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="865" class="bold">按字段存：原始值＋跟随/独立模式＋生效值；组数切换只改变活动组。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="907" class="">总性别、季节、品牌、仓库、默认单品价和时效各自联动。整套预算只有一份。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="218" y="941" class="">显式清空当前组 / 重置全部才删除输入；收起、关闭工具和切模式均不能清空。</ns0:text></g></svg>
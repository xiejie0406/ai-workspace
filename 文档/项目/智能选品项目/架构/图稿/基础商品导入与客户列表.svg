<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} .small{font-size:14px;fill:#60718a} .bold{font-weight:700} .title{font-size:26px;font-weight:700} .legacy text{font-size:16px;fill:#24364b} .legacy .small{font-size:14px;fill:#60718a} .legacy .title{font-size:26px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1050" rx="0" fill="#eef3f8" stroke="#dce5ef"/><rect x="0" y="0" width="1440" height="66" rx="0" fill="#152b49" stroke="#dce5ef"/><text x="24" y="41" font-size="22" fill="#fff" font-weight="700">智能选品</text><text x="165" y="39" font-size="16" fill="#fff" font-weight="400">商品资料</text><rect x="287" y="12" width="118" height="42" rx="7" fill="#216be8" stroke="#216be8"/><text x="297" y="39" font-size="16" fill="#fff" font-weight="400">资料导入</text><text x="429" y="39" font-size="16" fill="#fff" font-weight="400">仓库管理</text><text x="561" y="39" font-size="16" fill="#fff" font-weight="400">库存中心</text><text x="693" y="39" font-size="16" fill="#fff" font-weight="400">客户需求</text><text x="825" y="39" font-size="16" fill="#fff" font-weight="400">选品方案</text><text x="957" y="39" font-size="16" fill="#fff" font-weight="400">AI任务</text><text x="1089" y="39" font-size="16" fill="#fff" font-weight="400">提案交付</text><text x="1265" y="39" font-size="14" fill="#dbe6f5" font-weight="400">管理设置</text><text x="24" y="111" font-size="26" fill="#24364b" font-weight="700">基础商品导入与客户列表：字段清楚，操作按步骤展开</text><text x="24" y="144" font-size="14" fill="#60718a" font-weight="400">设计稿1.2 · 合成样例 · 顶部业务导航 · 价格/图片归商品资料 · 非生产验收</text><rect x="24" y="174" width="1392" height="430" rx="10" fill="#fff" stroke="#dce5ef"/><text x="44" y="208" font-size="19" fill="#24364b" font-weight="700">基础商品导入 · 与商品列表“导入”共用</text><text x="44" y="241" font-size="16" fill="#24364b" font-weight="400">步骤：选字段 / 下载模板 → 上传与映射 → 预览 → 发布 → 回商品列表核对</text><text x="44" y="279" font-size="16" fill="#24364b" font-weight="400">默认必填11项：来源、规格SKU、款号、名称、品类、颜色编码/名称、尺码、尺码制式、单位、季节。</text><text x="44" y="312" font-size="16" fill="#24364b" font-weight="400">默认可选2项：品牌、材质；可加主SKU、品号、货号、三级分类。高级字段按需选，旧模板兼容。</text><text x="44" y="345" font-size="16" fill="#24364b" font-weight="400">未选 / 缺列 / 默认空值保持原值；显式清空须预览确认。基础商品模板不混入价库、图片文件或操作列。</text><rect x="44" y="400" width="1350" height="178" rx="5" fill="#fff" stroke="#dce5ef"/><rect x="44" y="400" width="1350" height="44" rx="5" fill="#f3f7fc" stroke="#dce5ef"/><text x="54" y="428" font-size="14" fill="#24364b" font-weight="700">文件行</text><text x="154" y="428" font-size="14" fill="#24364b" font-weight="700">来源 / SKU</text><text x="384" y="428" font-size="14" fill="#24364b" font-weight="700">差异</text><text x="509" y="428" font-size="14" fill="#24364b" font-weight="700">原值</text><text x="774" y="428" font-size="14" fill="#24364b" font-weight="700">拟生效值</text><text x="1039" y="428" font-size="14" fill="#24364b" font-weight="700">行级错误</text><text x="1259" y="428" font-size="14" fill="#24364b" font-weight="700">操作</text><path d="M44 444 H1394" stroke="#dce5ef"/><text x="54" y="469" font-size="14" fill="#24364b" font-weight="400">2</text><text x="154" y="469" font-size="14" fill="#24364b" font-weight="400">MAIN / 00012-N-M</text><text x="384" y="469" font-size="14" fill="#24364b" font-weight="400">修改</text><text x="509" y="469" font-size="14" fill="#24364b" font-weight="400">品牌：原品牌</text><text x="509" y="490" font-size="14" fill="#24364b" font-weight="400">材质：棉</text><text x="774" y="469" font-size="14" fill="#24364b" font-weight="400">品牌：新品牌</text><text x="774" y="490" font-size="14" fill="#24364b" font-weight="400">材质：保持</text><text x="1039" y="469" font-size="14" fill="#24364b" font-weight="400">无</text><text x="1259" y="469" font-size="14" fill="#24364b" font-weight="400">查看</text><path d="M44 511 H1394" stroke="#dce5ef"/><text x="54" y="536" font-size="14" fill="#24364b" font-weight="400">3</text><text x="154" y="536" font-size="14" fill="#24364b" font-weight="400">MAIN / 00012-N-L</text><text x="384" y="536" font-size="14" fill="#24364b" font-weight="400">拒绝</text><text x="509" y="536" font-size="14" fill="#24364b" font-weight="400">—</text><text x="774" y="536" font-size="14" fill="#24364b" font-weight="400">尺码：空</text><text x="1039" y="536" font-size="14" fill="#24364b" font-weight="400">必填尺码缺失</text><text x="1259" y="536" font-size="14" fill="#24364b" font-weight="400">修正</text><rect x="24" y="625" width="1392" height="315" rx="10" fill="#fff" stroke="#dce5ef"/><text x="44" y="659" font-size="19" fill="#24364b" font-weight="700">客户列表 · 本次需求填写在选品工作单</text><rect x="44" y="684" width="1350" height="111" rx="5" fill="#fff" stroke="#dce5ef"/><rect x="44" y="684" width="1350" height="44" rx="5" fill="#f3f7fc" stroke="#dce5ef"/><text x="54" y="712" font-size="14" fill="#24364b" font-weight="700">客户编码</text><text x="194" y="712" font-size="14" fill="#24364b" font-weight="700">客户名称</text><text x="384" y="712" font-size="14" fill="#24364b" font-weight="700">类型</text><text x="499" y="712" font-size="14" fill="#24364b" font-weight="700">联系人</text><text x="629" y="712" font-size="14" fill="#24364b" font-weight="700">联系电话</text><text x="794" y="712" font-size="14" fill="#24364b" font-weight="700">地区</text><text x="944" y="712" font-size="14" fill="#24364b" font-weight="700">负责人</text><text x="1074" y="712" font-size="14" fill="#24364b" font-weight="700">状态</text><text x="1184" y="712" font-size="14" fill="#24364b" font-weight="700">操作</text><path d="M44 728 H1394" stroke="#dce5ef"/><text x="54" y="753" font-size="14" fill="#24364b" font-weight="400">C-001</text><text x="194" y="753" font-size="14" fill="#24364b" font-weight="400">客户A</text><text x="384" y="753" font-size="14" fill="#24364b" font-weight="400">团购</text><text x="499" y="753" font-size="14" fill="#24364b" font-weight="400">李先生</text><text x="629" y="753" font-size="14" fill="#24364b" font-weight="400">138****0000</text><text x="794" y="753" font-size="14" fill="#24364b" font-weight="400">上海</text><text x="944" y="753" font-size="14" fill="#24364b" font-weight="400">张经理</text><text x="1074" y="753" font-size="14" fill="#24364b" font-weight="400">启用</text><text x="1184" y="753" font-size="14" fill="#24364b" font-weight="400">编辑 / 进入需求</text><text x="44" y="816" font-size="15" fill="#24364b" font-weight="400">补充：协作者、内部备注。需求为场景、套数、预算、价格口径、季节/性别/风格、分类、颜色尺码、排除与交付。</text><text x="44" y="858" font-size="15" fill="#60718a" font-weight="400">需求AI整理先人工确认，再应用到工作单总条件与各组；没有额外正式报价流程。</text></svg>
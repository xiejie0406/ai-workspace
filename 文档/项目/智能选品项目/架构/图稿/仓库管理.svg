<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} .small{font-size:14px;fill:#60718a} .bold{font-weight:700} .title{font-size:26px;font-weight:700} .legacy text{font-size:16px;fill:#24364b} .legacy .small{font-size:14px;fill:#60718a} .legacy .title{font-size:26px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1050" rx="0" fill="#eef3f8" stroke="#dce5ef"/><rect x="0" y="0" width="1440" height="66" rx="0" fill="#152b49" stroke="#dce5ef"/><text x="24" y="41" font-size="22" fill="#fff" font-weight="700">智能选品</text><text x="165" y="39" font-size="16" fill="#fff" font-weight="400">商品资料</text><text x="297" y="39" font-size="16" fill="#fff" font-weight="400">资料导入</text><rect x="419" y="12" width="118" height="42" rx="7" fill="#216be8" stroke="#216be8"/><text x="429" y="39" font-size="16" fill="#fff" font-weight="400">仓库管理</text><text x="561" y="39" font-size="16" fill="#fff" font-weight="400">库存中心</text><text x="693" y="39" font-size="16" fill="#fff" font-weight="400">客户需求</text><text x="825" y="39" font-size="16" fill="#fff" font-weight="400">选品方案</text><text x="957" y="39" font-size="16" fill="#fff" font-weight="400">AI任务</text><text x="1089" y="39" font-size="16" fill="#fff" font-weight="400">提案交付</text><text x="1265" y="39" font-size="14" fill="#dbe6f5" font-weight="400">管理设置</text><text x="24" y="111" font-size="26" fill="#24364b" font-weight="700">仓库管理：维护名称、编码、启停与默认，库存和选品同源</text><text x="24" y="144" font-size="14" fill="#60718a" font-weight="400">设计稿1.2 · 合成样例 · 顶部业务导航 · 价格/图片归商品资料 · 非生产验收</text><rect x="24" y="174" width="1392" height="355" rx="10" fill="#fff" stroke="#dce5ef"/><text x="44" y="208" font-size="19" fill="#24364b" font-weight="700">仓库列表</text><text x="44" y="240" font-size="16" fill="#24364b" font-weight="400">仓库名称 / 编码    状态：启用 / 停用 / 全部    查询    新增仓库</text><rect x="44" y="268" width="1350" height="174" rx="5" fill="#fff" stroke="#dce5ef"/><rect x="44" y="268" width="1350" height="44" rx="5" fill="#f3f7fc" stroke="#dce5ef"/><text x="54" y="296" font-size="14" fill="#24364b" font-weight="700">编码</text><text x="199" y="296" font-size="14" fill="#24364b" font-weight="700">名称</text><text x="384" y="296" font-size="14" fill="#24364b" font-weight="700">状态</text><text x="484" y="296" font-size="14" fill="#24364b" font-weight="700">默认</text><text x="584" y="296" font-size="14" fill="#24364b" font-weight="700">排序</text><text x="684" y="296" font-size="14" fill="#24364b" font-weight="700">库存SKU数</text><text x="884" y="296" font-size="14" fill="#24364b" font-weight="700">最近库存业务时间</text><text x="1094" y="296" font-size="14" fill="#24364b" font-weight="700">操作</text><path d="M44 312 H1394" stroke="#dce5ef"/><text x="54" y="337" font-size="14" fill="#24364b" font-weight="400">MAIN</text><text x="199" y="337" font-size="14" fill="#24364b" font-weight="400">主仓</text><text x="384" y="337" font-size="14" fill="#24364b" font-weight="400">启用</text><text x="484" y="337" font-size="14" fill="#24364b" font-weight="400">是</text><text x="584" y="337" font-size="14" fill="#24364b" font-weight="400">1</text><text x="684" y="337" font-size="14" fill="#24364b" font-weight="400">1200</text><text x="884" y="337" font-size="14" fill="#24364b" font-weight="400">10-01 09:00</text><text x="1094" y="337" font-size="14" fill="#24364b" font-weight="400">编辑 / 查看库存</text><path d="M44 377 H1394" stroke="#dce5ef"/><text x="54" y="402" font-size="14" fill="#24364b" font-weight="400">NORTH</text><text x="199" y="402" font-size="14" fill="#24364b" font-weight="400">北区仓</text><text x="384" y="402" font-size="14" fill="#24364b" font-weight="400">启用</text><text x="484" y="402" font-size="14" fill="#24364b" font-weight="400">否</text><text x="584" y="402" font-size="14" fill="#24364b" font-weight="400">2</text><text x="684" y="402" font-size="14" fill="#24364b" font-weight="400">0</text><text x="884" y="402" font-size="14" fill="#24364b" font-weight="400">暂无库存</text><text x="1094" y="402" font-size="14" fill="#24364b" font-weight="400">设默认 / 编辑 / 停用</text><text x="44" y="488" font-size="15" fill="#60718a" font-weight="400">空仓库也必须出现在启用仓库选项中；库存数与业务时间为只读摘要。</text><rect x="24" y="550" width="1392" height="380" rx="10" fill="#fff" stroke="#dce5ef"/><text x="44" y="584" font-size="19" fill="#24364b" font-weight="700">仓库编辑 · 编码被引用后只读，名称允许修改</text><text x="44" y="619" font-size="16" fill="#24364b" font-weight="400">仓库编码：NORTH     仓库名称：北区仓     状态：启用     显示顺序：2</text><text x="44" y="667" font-size="16" fill="#24364b" font-weight="400">是否默认：否     备注：新建仓库，尚未导入库存     保存仓库</text><text x="44" y="715" font-size="16" fill="#24364b" font-weight="400">引用保护：编码已被库存、导入或方案引用时不能修改/删除，可停用；历史按原编码可查。</text><text x="44" y="763" font-size="16" fill="#24364b" font-weight="400">默认保护：停用默认仓库前必须先选择另一个有效默认仓库。</text><text x="44" y="811" font-size="16" fill="#24364b" font-weight="400">库存、导入、选品使用同一仓库字典，不从库存记录反推可选仓库。</text></svg>
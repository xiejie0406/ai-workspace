<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} .small{font-size:14px;fill:#60718a} .bold{font-weight:700} .title{font-size:26px;font-weight:700} .legacy text{font-size:16px;fill:#24364b} .legacy .small{font-size:14px;fill:#60718a} .legacy .title{font-size:26px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1050" rx="0" fill="#eef3f8" stroke="#dce5ef"/><rect x="0" y="0" width="1440" height="66" rx="0" fill="#152b49" stroke="#dce5ef"/><text x="24" y="41" font-size="22" fill="#fff" font-weight="700">智能选品</text><text x="165" y="39" font-size="16" fill="#fff" font-weight="400">商品资料</text><text x="297" y="39" font-size="16" fill="#fff" font-weight="400">资料导入</text><text x="429" y="39" font-size="16" fill="#fff" font-weight="400">仓库管理</text><text x="561" y="39" font-size="16" fill="#fff" font-weight="400">库存中心</text><text x="693" y="39" font-size="16" fill="#fff" font-weight="400">客户需求</text><rect x="815" y="12" width="118" height="42" rx="7" fill="#216be8" stroke="#216be8"/><text x="825" y="39" font-size="16" fill="#fff" font-weight="400">选品方案</text><text x="957" y="39" font-size="16" fill="#fff" font-weight="400">AI任务</text><text x="1089" y="39" font-size="16" fill="#fff" font-weight="400">提案交付</text><text x="1265" y="39" font-size="14" fill="#dbe6f5" font-weight="400">管理设置</text><text x="24" y="111" font-size="26" fill="#24364b" font-weight="700">区间与无结果：错误定位到具体字段</text><text x="24" y="144" font-size="14" fill="#60718a" font-weight="400">设计稿1.2 · 合成样例 · 顶部业务导航 · 价格/图片归商品资料 · 非生产验收</text><g class="legacy" transform="translate(-188.4 110) scale(1.13 1)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="100" width="1225" height="265" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="138" class="bold">第2组 · 下装</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="182" class="small">团购价下限</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="192" width="340" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="226" y="217" class="">150.00</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="590" y="182" class="small">团购价上限</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="590" y="192" width="340" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="601" y="217" class="">100.00</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="212" y="240" width="930" height="84" rx="12" fill="#fff0ef" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="230" y="274" class="" style="fill:#af3434;font-size:17px">团购价下限不能大于上限。请修改第2组团购价上限。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="230" y="303" class="small">其他组输入和已保存草稿保留。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="383" width="1225" height="211" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="425" class="bold">总条件</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="468" class="">团购套数：必须为正整数；库存上下限不能倒置；日期起止不能倒置。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="508" class="">单套总价：至少一组缺所选价格时不能当作0，反馈具体组和商品。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="548" class="">必填分类为空：定位该活动组。隐藏组不参与校验，不自动清空。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="613" width="1225" height="249" rx="12" fill="#e9f2ff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="654" class="bold">无结果 / 不可用反馈</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="698" class="">当前第3组无符合分类＋库存需求100的商品。可调整第3组条件。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="738" class="">销量推荐未接入统计来源：禁用该推荐，库存推荐与人工选品可继续。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="778" class="">仓库被停用：历史草稿显示原仓库，生成新池需重新选择启用仓库。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="818" class="">候选超过保护上限：返回实际计数与缩小条件建议，不静默截断。</ns0:text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1070" viewBox="0 0 1440 1070"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} .small{font-size:14px;fill:#60718a} .bold{font-weight:700} .title{font-size:26px;font-weight:700} .legacy text{font-size:16px;fill:#24364b} .legacy .small{font-size:14px;fill:#60718a} .legacy .title{font-size:26px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1070" rx="0" fill="#eef3f8" stroke="#dce5ef"/><rect x="0" y="0" width="1440" height="66" rx="0" fill="#152b49" stroke="#dce5ef"/><text x="24" y="41" font-size="22" fill="#fff" font-weight="700">智能选品</text><text x="165" y="39" font-size="16" fill="#fff" font-weight="400">商品资料</text><text x="297" y="39" font-size="16" fill="#fff" font-weight="400">资料导入</text><text x="429" y="39" font-size="16" fill="#fff" font-weight="400">仓库管理</text><text x="561" y="39" font-size="16" fill="#fff" font-weight="400">库存中心</text><text x="693" y="39" font-size="16" fill="#fff" font-weight="400">客户需求</text><rect x="815" y="12" width="118" height="42" rx="7" fill="#216be8" stroke="#216be8"/><text x="825" y="39" font-size="16" fill="#fff" font-weight="400">选品方案</text><text x="957" y="39" font-size="16" fill="#fff" font-weight="400">AI任务</text><text x="1089" y="39" font-size="16" fill="#fff" font-weight="400">提案交付</text><text x="1265" y="39" font-size="14" fill="#dbe6f5" font-weight="400">管理设置</text><text x="24" y="111" font-size="26" fill="#24364b" font-weight="700">完整方案池与已选方案：统一商品格，完整字段在展开详情</text><text x="24" y="144" font-size="14" fill="#60718a" font-weight="400">设计稿1.2 · 合成样例 · 顶部业务导航 · 价格/图片归商品资料 · 非生产验收</text><rect x="24" y="174" width="1392" height="365" rx="10" fill="#fff" stroke="#dce5ef"/><text x="44" y="208" font-size="19" fill="#24364b" font-weight="700">商品筛选 → 完整方案池 → 已选方案</text><text x="44" y="241" font-size="16" fill="#24364b" font-weight="400">120套（合成样例）    库存最多 / 销量最高    每页20 / 50 / 100    跨页全选 / 排除</text><rect x="44" y="269" width="1355" height="176" rx="5" fill="#fff" stroke="#dce5ef"/><rect x="44" y="269" width="1355" height="44" rx="5" fill="#f3f7fc" stroke="#dce5ef"/><text x="54" y="297" font-size="14" fill="#24364b" font-weight="700">选择</text><text x="109" y="297" font-size="14" fill="#24364b" font-weight="700">编号</text><text x="184" y="297" font-size="14" fill="#24364b" font-weight="700">第一组商品</text><text x="349" y="297" font-size="14" fill="#24364b" font-weight="700">第二组商品</text><text x="514" y="297" font-size="14" fill="#24364b" font-weight="700">第三组商品</text><text x="679" y="297" font-size="14" fill="#24364b" font-weight="700">第四组商品</text><text x="844" y="297" font-size="14" fill="#24364b" font-weight="700">团购合计</text><text x="964" y="297" font-size="14" fill="#24364b" font-weight="700">VIP合计</text><text x="1084" y="297" font-size="14" fill="#24364b" font-weight="700">可供套数</text><text x="1184" y="297" font-size="14" fill="#24364b" font-weight="700">需求满足</text><text x="1294" y="297" font-size="14" fill="#24364b" font-weight="700">热销分数</text><path d="M44 313 H1399" stroke="#dce5ef"/><text x="54" y="338" font-size="14" fill="#24364b" font-weight="400">□</text><text x="109" y="338" font-size="14" fill="#24364b" font-weight="400">方案01</text><text x="184" y="338" font-size="14" fill="#24364b" font-weight="400">POLO / 主SKU01</text><text x="349" y="338" font-size="14" fill="#24364b" font-weight="400">裤装 / 主SKU02</text><text x="514" y="338" font-size="14" fill="#24364b" font-weight="400">鞋 / 主SKU03</text><text x="679" y="338" font-size="14" fill="#24364b" font-weight="400">帽 / 主SKU04</text><text x="844" y="338" font-size="14" fill="#24364b" font-weight="400">¥250–280</text><text x="964" y="338" font-size="14" fill="#24364b" font-weight="400">¥230–260</text><text x="1084" y="338" font-size="14" fill="#24364b" font-weight="400">120</text><text x="1184" y="338" font-size="14" fill="#24364b" font-weight="400">100套：满足</text><text x="1294" y="338" font-size="14" fill="#24364b" font-weight="400">1320</text><path d="M44 379 H1399" stroke="#dce5ef"/><text x="54" y="404" font-size="14" fill="#24364b" font-weight="400">□</text><text x="109" y="404" font-size="14" fill="#24364b" font-weight="400">方案02</text><text x="184" y="404" font-size="14" fill="#24364b" font-weight="400">POLO / 主SKU05</text><text x="349" y="404" font-size="14" fill="#24364b" font-weight="400">裤装 / 主SKU02</text><text x="514" y="404" font-size="14" fill="#24364b" font-weight="400">鞋 / 主SKU03</text><text x="679" y="404" font-size="14" fill="#24364b" font-weight="400">帽 / 主SKU04</text><text x="844" y="404" font-size="14" fill="#24364b" font-weight="400">¥260–290</text><text x="964" y="404" font-size="14" fill="#24364b" font-weight="400">¥240–270</text><text x="1084" y="404" font-size="14" fill="#24364b" font-weight="400">未知</text><text x="1184" y="404" font-size="14" fill="#24364b" font-weight="400">待核对</text><text x="1294" y="404" font-size="14" fill="#24364b" font-weight="400">未知</text><text x="44" y="473" font-size="15" fill="#24364b" font-weight="400">商品格：主图、名称、主SKU；品号/货号、展示规格、双价、仓库/时点与销量在详情逐组列明。</text><text x="44" y="507" font-size="15" fill="#60718a" font-weight="400">推荐排序不减少全集；库存取短板可供套数，销量缺来源禁用，不补0。</text><rect x="24" y="558" width="1392" height="265" rx="10" fill="#fff" stroke="#dce5ef"/><text x="44" y="592" font-size="19" fill="#24364b" font-weight="700">已选方案 · 名称、顺序、展示颜色/规格与工具状态</text><rect x="44" y="616" width="1352" height="120" rx="5" fill="#fff" stroke="#dce5ef"/><rect x="44" y="616" width="1352" height="44" rx="5" fill="#f3f7fc" stroke="#dce5ef"/><text x="54" y="644" font-size="14" fill="#24364b" font-weight="700">顺序</text><text x="134" y="644" font-size="14" fill="#24364b" font-weight="700">方案名称</text><text x="324" y="644" font-size="14" fill="#24364b" font-weight="700">各组商品 / 展示颜色</text><text x="664" y="644" font-size="14" fill="#24364b" font-weight="700">团购合计</text><text x="794" y="644" font-size="14" fill="#24364b" font-weight="700">VIP合计</text><text x="924" y="644" font-size="14" fill="#24364b" font-weight="700">可供套数</text><text x="1024" y="644" font-size="14" fill="#24364b" font-weight="700">试衣状态</text><text x="1174" y="644" font-size="14" fill="#24364b" font-weight="700">操作</text><path d="M44 660 H1396" stroke="#dce5ef"/><text x="54" y="685" font-size="14" fill="#24364b" font-weight="400">1</text><text x="134" y="685" font-size="14" fill="#24364b" font-weight="400">团建日常套装</text><text x="324" y="685" font-size="14" fill="#24364b" font-weight="400">POLO藏蓝 / 裤装灰</text><text x="324" y="706" font-size="14" fill="#24364b" font-weight="400">鞋白 / 帽藏蓝</text><text x="664" y="685" font-size="14" fill="#24364b" font-weight="400">¥260</text><text x="794" y="685" font-size="14" fill="#24364b" font-weight="400">¥240</text><text x="924" y="685" font-size="14" fill="#24364b" font-weight="400">120</text><text x="1024" y="685" font-size="14" fill="#24364b" font-weight="400">待复核</text><text x="1024" y="706" font-size="14" fill="#24364b" font-weight="400">鞋帽未试衣</text><text x="1174" y="685" font-size="14" fill="#24364b" font-weight="400">改名 / 排序 / 选色</text><text x="1174" y="706" font-size="14" fill="#24364b" font-weight="400">保存 / 打开工具</text><text x="44" y="780" font-size="15" fill="#24364b" font-weight="400">完整补充：需求满足、提案准备、规格SKU、素材、价库快照、输入版本及过期提示。</text><rect x="24" y="847" width="1392" height="150" rx="10" fill="#fff5e9" stroke="#dce5ef"/><text x="44" y="887" font-size="16" fill="#24364b" font-weight="400">不定规格时价格仍显示区间；选定展示规格后显示对应金额，不冒充已完成采购尺码方案。</text><text x="44" y="920" font-size="16" fill="#24364b" font-weight="400">修改筛选条件生成新池，旧池历史保留；新池不继承旧池的“全选”范围。</text><text x="44" y="953" font-size="16" fill="#24364b" font-weight="400">试衣与PPT在同一工作区上下排列；关闭/Esc不丢失配置或重复提交。</text></svg>
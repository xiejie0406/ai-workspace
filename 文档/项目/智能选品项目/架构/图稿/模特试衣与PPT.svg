<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1400" viewBox="0 0 1440 1400"><style>text{font-family:Microsoft YaHei,Arial,sans-serif} .small{font-size:14px;fill:#60718a} .bold{font-weight:700} .title{font-size:26px;font-weight:700} .legacy text{font-size:16px;fill:#24364b} .legacy .small{font-size:14px;fill:#60718a} .legacy .title{font-size:26px;font-weight:700}</style><rect x="0" y="0" width="1440" height="1400" rx="0" fill="#eef3f8" stroke="#dce5ef"/><rect x="0" y="0" width="1440" height="66" rx="0" fill="#152b49" stroke="#dce5ef"/><text x="24" y="41" font-size="22" fill="#fff" font-weight="700">智能选品</text><text x="165" y="39" font-size="16" fill="#fff" font-weight="400">商品资料</text><text x="297" y="39" font-size="16" fill="#fff" font-weight="400">资料导入</text><text x="429" y="39" font-size="16" fill="#fff" font-weight="400">仓库管理</text><text x="561" y="39" font-size="16" fill="#fff" font-weight="400">库存中心</text><text x="693" y="39" font-size="16" fill="#fff" font-weight="400">客户需求</text><rect x="815" y="12" width="118" height="42" rx="7" fill="#216be8" stroke="#216be8"/><text x="825" y="39" font-size="16" fill="#fff" font-weight="400">选品方案</text><text x="957" y="39" font-size="16" fill="#fff" font-weight="400">AI任务</text><text x="1089" y="39" font-size="16" fill="#fff" font-weight="400">提案交付</text><text x="1265" y="39" font-size="14" fill="#dbe6f5" font-weight="400">管理设置</text><text x="24" y="111" font-size="26" fill="#24364b" font-weight="700">已选工作区：上方模特试衣，下方PPT提案</text><text x="24" y="144" font-size="14" fill="#60718a" font-weight="400">设计稿1.2 · 合成样例 · 顶部业务导航 · 价格/图片归商品资料 · 非生产验收</text><g class="legacy" transform="translate(-188.4 110) scale(1.13 1)"><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="100" width="1225" height="72" rx="12" fill="#e9f2ff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="143" class="">已选3套 · 草稿版本8 · 关闭 / Esc保留配置和已受理任务</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="1300" y="117" width="85" height="36" rx="8" fill="#f0f5fc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="1312" y="141" class="" style="fill:#24364b;font-size:15px">关闭</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="192" width="1225" height="490" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="234" class="title">上栏 · 模特试衣 / 换装</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="267" class="small">阿里云百炼 aitryon-plus · 服务未开通时显示不可用；图稿不调用API</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="312" class="small">人物素材</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="322" width="450" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="226" y="347" class="">正面全身模特图 / 许可已核对</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="715" y="312" class="small">衣物来源</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="715" y="322" width="600" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="726" y="347" class="">已选方案P-0001 · 上装 / 下装</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="382" width="440" height="199" rx="12" fill="#eef3f8" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="237" y="425" class="">人物输入预览 + 已选服饰平拍图</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="237" y="462" class="">支持上装 / 下装 / 连体服</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="237" y="499" class="">鞋帽使用商品原图，标“未试衣”。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="237" y="536" class="">缺服饰不能用随机生成衣服冒充已选。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="680" y="382" width="690" height="199" rx="12" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="704" y="425" class="">任务：排队 / 处理中 / 待复核 / 失败 / 结果未知</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="704" y="462" class="">结果：款式、颜色、标识、完整性逐项复核。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="704" y="499" class="">采用写入当前草稿版本；过期结果不得覆盖新方案。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="704" y="536" class="">关闭窗口不取消任务；失败保留原图路径。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="612" width="170" height="36" rx="8" fill="#216be8" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="227" y="636" class="" style="fill:#fff;font-size:15px">发起试衣任务</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="405" y="612" width="170" height="36" rx="8" fill="#f0f5fc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="417" y="636" class="" style="fill:#24364b;font-size:15px">复核后采用</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="190" y="704" width="1225" height="506" rx="12" fill="#fff" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="747" class="title">下栏 · PPT提案</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="803" class="small">选中范围 / 顺序</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="813" width="550" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="226" y="838" class="">仅已选3套 · 拖动排序 / 修改名称</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="800" y="803" class="small">展示价格</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="800" y="813" width="545" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="811" y="838" class="">团购价 / VIP价 / 不展示价</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="889" class="small">图片模式</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="899" width="550" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="226" y="924" class="">商品原图 / 已采用试衣图</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="800" y="889" class="small">未覆盖与过期反馈</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="800" y="899" width="545" height="37" rx="7" fill="#f8fafc" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="811" y="924" class="">鞋帽未试衣；过期图需重新复核</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="1009" class="">预检逐方案列出：缺图 / 缺价 / 无许可 / 版本变化 / 无权限。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="1048" class="">先得到同版本预检结果，再生成可编辑PPTX；不要求正式报价号。</ns0:text><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="1087" class="">显示页数、文件体积、失败重试与下载；不把图稿按钮冒充真实文件导出。</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="215" y="1146" width="150" height="36" rx="8" fill="#216be8" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="227" y="1170" class="" style="fill:#fff;font-size:15px">检查提案</ns0:text><ns0:rect xmlns:ns0="http://www.w3.org/2000/svg" x="385" y="1146" width="155" height="36" rx="8" fill="#216be8" stroke="#dce5ef" /><ns0:text xmlns:ns0="http://www.w3.org/2000/svg" x="397" y="1170" class="" style="fill:#fff;font-size:15px">导出PPTX</ns0:text></g></svg>
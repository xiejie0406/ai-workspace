<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000">
<style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#273248;font-size:16px}.title{font-size:22px;font-weight:600}.small{font-size:14px;fill:#68738a}.blue{fill:#275eff}.white{fill:#fff}.warn{fill:#8a5a16}.bad{fill:#b32935}</style>
<rect width="1240" height="1000" fill="#f4f6fa"/>
<text x="30" y="38" class="title">原工作流导入弹窗：预览与草稿确认设计</text>
<text x="30" y="68" class="small">设计示意 · 沿用原导入入口与上传组件 · 不作为运行或验收截图</text>
<g transform="translate(30 100)">
<rect width="570" height="400" rx="14" fill="white" stroke="#dce2ed"/>
<text x="24" y="38" class="title">1. 选择文件并预览</text><text x="530" y="38">×</text>
<rect x="24" y="68" width="522" height="125" rx="8" fill="#fafbff" stroke="#b9c7ec" stroke-dasharray="5 4"/>
<text x="169" y="112" class="blue">拖入或选择 YAML 文件</text>
<text x="124" y="147" class="small">保留原画布与流程字段，单文件不超过20MiB</text>
<text x="24" y="225">示例流程.yaml　　12 KB</text>
<text x="24" y="257" class="small">预览只读取文件，不创建智能体或工作流。</text>
<text x="24" y="283" class="small">替换文件或切换空间后，需要重新预览。</text>
<rect x="325" y="334" width="80" height="40" rx="6" fill="#f2f4f7"/>
<text x="349" y="360">取消</text>
<rect x="418" y="334" width="128" height="40" rx="6" fill="#275eff"/>
<text x="450" y="360" class="white">预览文件</text>
</g>
<g transform="translate(640 100)">
<rect width="570" height="400" rx="14" fill="white" stroke="#dce2ed"/>
<text x="24" y="38" class="title">2. 预览完成：纯计算草稿</text><text x="530" y="38">×</text>
<text x="24" y="78">流程名称：文本拼接示例</text>
<text x="24" y="112">节点：4　　连线：3　　待绑定资源：0</text>
<rect x="24" y="135" width="522" height="58" rx="6" fill="#edf7f0"/>
<text x="40" y="170">结构检查通过，可保存为新的工作流草稿。</text>
<text x="24" y="224">转换差异</text>
<text x="24" y="254" class="small">旧身份与发布状态不导入，名称由中心校验。</text>
<text x="24" y="282" class="small">节点配置、未知扩展和画布布局按对应规则保留。</text>
<rect x="246" y="334" width="108" height="40" rx="6" fill="#f2f4f7"/>
<text x="266" y="360">重新预览</text>
<rect x="366" y="334" width="180" height="40" rx="6" fill="#275eff"/>
<text x="394" y="360" class="white">确认保存为草稿</text>
</g>
<g transform="translate(30 530)">
<rect width="570" height="400" rx="14" fill="white" stroke="#dce2ed"/>
<text x="24" y="38" class="title">3. 存在待绑定资源</text><text x="530" y="38">×</text>
<text x="24" y="80">流程名称：知识问答示例　　节点：6</text>
<rect x="24" y="100" width="522" height="62" rx="6" fill="#fff7e8"/>
<text x="40" y="128" class="warn">原资源引用不自动获得当前空间授权。</text>
<text x="40" y="151" class="small">允许保存时仅保存待绑定草稿，不能直接运行。</text>
<text x="24" y="194">节点「模型」：模型版本待绑定</text>
<text x="24" y="228">节点「知识检索」：知识资源待绑定</text>
<text x="24" y="266" class="small">差异按节点和字段路径显示；不展示包内凭据。</text>
<text x="24" y="294" class="small">保存资格由中心预览结果决定，缺口不会记为完成。</text>
<rect x="246" y="334" width="108" height="40" rx="6" fill="#f2f4f7"/>
<text x="266" y="360">重新预览</text>
<rect x="366" y="334" width="180" height="40" rx="6" fill="#275eff"/>
<text x="394" y="360" class="white">确认保存为草稿</text>
</g>
<g transform="translate(640 530)">
<rect width="570" height="400" rx="14" fill="white" stroke="#dce2ed"/>
<text x="24" y="38" class="title">4. 拒绝、失效与等待</text><text x="530" y="38">×</text>
<rect x="24" y="66" width="522" height="90" rx="6" fill="#fff1f0"/>
<text x="40" y="94" class="bad">无法确认保存：文件结构无效或包含未处理凭据。</text>
<text x="40" y="123" class="small">显示原因及字段路径，请修正文件后重新预览。</text>
<text x="24" y="193">确认失效：文件、登录主体或空间已改变</text>
<text x="24" y="224" class="small">重新预览；失败时保留文件，不自动重试创建。</text>
<text x="24" y="265">正在预览／保存：按钮显示等待并防止重复提交</text>
<text x="24" y="294" class="small">保存中禁止重复确认；保存成功后打开原画布。</text>
<rect x="246" y="334" width="108" height="40" rx="6" fill="#f2f4f7"/>
<text x="266" y="360">重新预览</text>
<rect x="366" y="334" width="180" height="40" rx="6" fill="#e1e5ec"/>
<text x="394" y="360" class="small">确认保存为草稿</text>
</g>
<text x="30" y="966" class="small">入口：原创建菜单 → 导入工作流；实际接口：原中心兼容层。完整资源映射与业务验收仍按迁移设计接续。</text>
</svg>

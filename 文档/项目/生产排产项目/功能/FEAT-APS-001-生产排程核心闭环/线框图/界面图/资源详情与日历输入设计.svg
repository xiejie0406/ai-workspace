<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><style>text{font-family:Microsoft YaHei,Segoe UI,sans-serif}</style><rect x="0" y="0" width="1600" height="1100" rx="0" fill="#f4f6f8" stroke="#f4f6f8"/><rect x="0" y="0" width="1600" height="94" rx="0" fill="#263447" stroke="#263447"/><text x="28" y="40" font-size="30" fill="#ffffff" font-weight="700">生产排产 · 资源详情与日历输入</text><text x="28" y="73" font-size="20" fill="#dce6f0">设计稿 1.0 · 合成例子 · 未执行业务操作</text><rect x="24" y="120" width="220" height="940" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="45" y="162" font-size="23" fill="#263447" font-weight="700">生产排产系统</text><rect x="38" y="188" width="190" height="45" rx="8" fill="#e2ebf3" stroke="#e2ebf3"/><text x="49" y="217" font-size="21" fill="#263447">资源与日历</text><text x="49" y="272" font-size="21" fill="#263447">产品与工艺路线</text><text x="49" y="327" font-size="21" fill="#263447">订单与任务</text><text x="49" y="382" font-size="21" fill="#263447">数据就绪</text><text x="49" y="437" font-size="21" fill="#263447">排程工作台</text><text x="49" y="492" font-size="21" fill="#263447">正式计划</text><text x="49" y="547" font-size="21" fill="#263447">现场执行</text><text x="49" y="602" font-size="21" fill="#263447">生产报表</text><rect x="266" y="120" width="1308" height="940" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="292" y="160" font-size="27" fill="#263447" font-weight="700">人员资源 / 张师傅 · 焊锡技能三级</text><text x="292" y="194" font-size="20" fill="#52657a">稳定身份用于去重；详情连接技能、日历、任务和实际占用</text><rect x="292" y="215" width="126" height="44" rx="8" fill="#edf2f6" stroke="#ced8e3"/><text x="304" y="244" font-size="19" fill="#263447">基本资料</text><rect x="430" y="215" width="126" height="44" rx="8" fill="#edf2f6" stroke="#ced8e3"/><text x="442" y="244" font-size="19" fill="#263447">技能资格</text><rect x="568" y="215" width="126" height="44" rx="8" fill="#edf2f6" stroke="#ced8e3"/><text x="580" y="244" font-size="19" fill="#263447">日历</text><rect x="710" y="215" width="166" height="44" rx="8" fill="#edf2f6" stroke="#ced8e3"/><text x="722" y="244" font-size="19" fill="#263447">产能（待定）</text><rect x="890" y="215" width="126" height="44" rx="8" fill="#edf2f6" stroke="#ced8e3"/><text x="902" y="244" font-size="19" fill="#263447">任务与占用</text><rect x="292" y="285" width="600" height="275" rx="8" fill="#f8fafc" stroke="#ced8e3"/><text x="313" y="319" font-size="23" fill="#263447" font-weight="700">当前标准时间的计算依据</text><text x="313" y="360" font-size="20" fill="#263447">产品 / 工序：主控板A / 焊锡</text><text x="313" y="396" font-size="20" fill="#263447">工艺标准：60件/小时；准备20分钟</text><text x="313" y="432" font-size="20" fill="#263447">100件 = 20 + 100÷60×60 = 120分钟</text><text x="313" y="469" font-size="20" fill="#263447">净8小时、已排2小时 → 剩余6小时</text><text x="313" y="510" font-size="20" fill="#52657a">须同时满足人员、设备和连续窗口</text><rect x="912" y="285" width="636" height="275" rx="8" fill="#fff8eb" stroke="#d9c399"/><text x="934" y="319" font-size="23" fill="#263447" font-weight="700">专属产能：待定扩展</text><text x="934" y="360" font-size="20" fill="#263447">讨论粒度：资源＋产品＋工序＋阶段＋版本</text><text x="934" y="396" font-size="20" fill="#263447">缺档案是否回退、驱动角色与生效权限待定</text><text x="934" y="432" font-size="20" fill="#263447">不把同时装载容量当速度，不默认人数翻倍</text><text x="934" y="469" font-size="20" fill="#263447">此区域是设计讨论，不改变当前计算规则</text><text x="934" y="510" font-size="20" fill="#52657a">输入与生效须先明确模型及版本影响</text><text x="292" y="605" font-size="25" fill="#263447" font-weight="700">新增日历窗口</text><text x="292" y="639" font-size="20" fill="#52657a">入口：资源详情 → 日历 → 新增；站点时区：Asia/Shanghai</text><text x="292" y="666" font-size="19" fill="#263447" font-weight="700">具体资源</text><rect x="292" y="678" width="598" height="46" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="305" y="709" font-size="19" fill="#4b6075">张师傅 · 装配车间（按名称选择）</text><text x="930" y="666" font-size="19" fill="#263447" font-weight="700">窗口类型 *</text><rect x="930" y="678" width="598" height="46" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="943" y="709" font-size="19" fill="#4b6075">可用 / 不可用（只有两种）</text><text x="292" y="756" font-size="19" fill="#263447" font-weight="700">开始时间 *</text><rect x="292" y="768" width="598" height="46" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="305" y="799" font-size="19" fill="#4b6075">2026-10-02 08:00</text><text x="930" y="756" font-size="19" fill="#263447" font-weight="700">结束时间 *</text><rect x="930" y="768" width="598" height="46" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="943" y="799" font-size="19" fill="#4b6075">2026-10-02 07:00（错误状态示例）</text><text x="292" y="846" font-size="19" fill="#263447" font-weight="700">来源方式 *</text><rect x="292" y="858" width="598" height="46" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="305" y="889" font-size="19" fill="#4b6075">人工维护；获批加班可记来源引用</text><text x="930" y="846" font-size="19" fill="#263447" font-weight="700">原因与来源引用</text><rect x="930" y="858" width="598" height="46" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="943" y="889" font-size="19" fill="#4b6075">请假、维修等是原因，不新增窗口类型</text><rect x="292" y="924" width="1256" height="48" rx="8" fill="#fff0ef" stroke="#e1b9b6"/><text x="307" y="955" font-size="19" fill="#9d3030">错误：结束须晚于开始；保留输入并定位字段。提交中禁重复，成功后回查净窗口。</text><rect x="292" y="995" width="158" height="44" rx="8" fill="#315679" stroke="#315679"/><text x="312" y="1024" font-size="20" fill="#ffffff">保存并回查</text><rect x="469" y="995" width="105" height="44" rx="8" fill="#ffffff" stroke="#ced8e3"/><text x="491" y="1024" font-size="20" fill="#263447">取消</text><text x="600" y="1024" font-size="18" fill="#52657a">取消不写入；加班须有批准来源，不能因排不上自动开启</text></svg>
          {
            "name": "taskId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "leaseToken",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "fencingToken",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "name": "attempt",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1
            }
          },
          {
            "name": "assetId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "受预算约束的资源字节",
            "content": {
              "application/octet-stream": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "403": {
            "description": "服务身份/租约无效"
          },
          "404": {
            "description": "无此任务允许的资源"
          },
          "409": {
            "description": "旧attempt或fencingToken"
          }
        }
      }
    },
    "/internal/aippt/tasks/{taskId}/assets": {
      "post": {
        "operationId": "post_internal_aippt_task_asset",
        "summary": "暂存租约绑定的候选制品",
        "security": [
          {
            "WorkerKey": []
          }
        ],
        "parameters": [
          {
            "name": "taskId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "required": [
                  "file",
                  "leaseToken",
                  "fencingToken",
                  "attempt",
                  "role"
                ],
                "properties": {
                  "file": {
                    "type": "string",
                    "format": "binary"
                  },
                  "leaseToken": {
                    "type": "string"
                  },
                  "fencingToken": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "attempt": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "role": {
                    "enum": [
                      "image",
                      "export"
                    ]
                  },
                  "mime": {
                    "type": "string"
                  },
                  "size": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "sha256": {
                    "type": "string",
                    "pattern": "^[a-f0-9]{64}$"
                  }
                }
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "暂存uploadId/asset_id；正式引用只在complete校验后提交"
          },
          "409": {
            "description": "过期租约"
          },
          "422": {
            "description": "文件魔数/大小/解码/hash或role不合法"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "RuoYiBearer": {
        "type": "http",
        "scheme": "bearer",
        "description": "共享若依Token，不新增登录注册"
      },
      "WorkerKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Aippt-Worker-Key",
        "description": "内网服务凭据，仅Worker任务及租约绑定资源许可，不能访问用户API"
      }
    },
    "schemas": {
      "ProjectCreate": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "audience": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 100
          },
          "tone": {
            "enum": [
              "professional",
              "plain",
              "punchy"
            ]
          },
          "page_count": {
            "type": "integer",
            "minimum": 5,
            "maximum": 20
          },
          "layout_mode": {
            "enum": [
              "fixed",
              "flex"
            ]
          },
          "content_density": {
            "enum": [
              "concise",
              "medium",
              "detailed"
            ]
          },
          "theme_id": {
            "type": "string"
          }
        },
        "required": [
          "title"
        ],
        "additionalProperties": false
      },
      "CommandVersion": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "input_revision": {
            "type": "integer",
            "minimum": 0
          },
          "outline_revision": {
            "type": "integer",
            "minimum": 0
          },
          "deck_revision": {
            "type": "integer",
            "minimum": 0
          },
          "theme_revision": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [],
        "additionalProperties": false
      },
      "Deck": {
        "$ref": "./schemas/content.schema.json"
      },
      "OutlineDraft": {
        "$ref": "./schemas/outline.schema.json"
      },
      "LayoutTree": {
        "$ref": "./schemas/layout-tree.schema.json"
      },
      "ThemeOverrides": {
        "$ref": "./schemas/theme.schema.json"
      },
      "WorkerTask": {
        "$ref": "./schemas/worker.schema.json"
      },
      "TaskEvent": {
        "$ref": "./events-v1.schema.json"
      },
      "WorkerReceipt": {
        "type": "object",
        "properties": {
          "attempt": {
            "type": "integer",
            "minimum": 1
          },
          "leaseToken": {
            "type": "string",
            "minLength": 16
          },
          "fencingToken": {
            "type": "integer",
            "minimum": 1
          },
          "output": {
            "type": "object",
            "description": "font相关任务（generate_slide/ai_edit/relayout/quality/export）必须回传实际资源身份及验证模式；中心与领取时不可变payload再次核对。其他业务字段按任务类型校验。",
            "properties": {
              "font_manifest_hash": {
                "$ref": "./schemas/font-manifest.schema.json#/$defs/resourceHash"
              },
              "font_mode": {
                "$ref": "./schemas/font-manifest.schema.json#/$defs/fontMode"
              }
            }
          },
          "assets": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/AssetManifest"
            }
          },
          "message": {
            "type": "string"
          },
          "progress": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "percent": {
                "type": "integer",
                "minimum": 0,
                "maximum": 100
              },
              "message": {
                "type": "string",
                "maxLength": 1000
              },
              "stage": {
                "type": "string",
                "maxLength": 100
              }
            },
            "required": [
              "percent"
            ]
          },
          "errorCode": {
            "type": "string"
          },
          "code": {
            "type": "string"
          },
          "retryable": {
            "type": "boolean"
          },
          "workerId": {
            "type": "string"
          },
          "execution": {
            "$ref": "#/components/schemas/ExecutionSummary"
          },
          "verification_failure": {
            "$ref": "#/components/schemas/ExportVerificationFailure"
          }
        },
        "required": [
          "attempt",
          "leaseToken",
          "fencingToken"
        ],
        "additionalProperties": false
      },
      "AssetManifest": {
        "type": "object",
        "properties": {
          "uploadId": {
            "type": "string"
          },
          "mime": {
            "type": "string"
          },
          "sha256": {
            "type": "string",
            "pattern": "^[a-f0-9]{64}$"
          },
          "size": {
            "type": "integer",
            "minimum": 1
          },
          "role": {
            "enum": [
              "image",
              "export"
            ]
          }
        },
        "required": [
          "uploadId",
          "mime",
          "sha256",
          "size",
          "role"
        ],
        "additionalProperties": false
      },
      "WorkerClaim": {
        "type": "object",
        "properties": {
          "workerId": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "catalogVersion": {
            "type": "string"
          },
          "waitMillis": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000,
            "default": 0,
            "description": "非权威通知的最大等待毫秒数；等待不占用数据库事务，唤醒后仍执行正式领取和租约校验。"
          },
          "types": {
            "type": "array",
            "items": {
              "enum": [
                "parse_source",
                "generate_outline",
                "generate_slide",
                "ai_edit",
                "relayout",
                "quality",
                "export"
              ]
            }
          }
        },
        "required": [
          "workerId",
          "catalogVersion"
        ],
        "additionalProperties": false
      },
      "ProjectUpdate": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "audience": {
            "type": [
              "string",
              "null"
            ],
            "maxLength": 100
          },
          "tone": {
            "enum": [
              "professional",
              "plain",
              "punchy"
            ]
          },
          "page_count": {
            "type": "integer",
            "minimum": 5,
            "maximum": 20
          },
          "layout_mode": {
            "enum": [
              "fixed",
              "flex"
            ]
          },
          "content_density": {
            "enum": [
              "concise",
              "medium",
              "detailed"
            ]
          },
          "theme_id": {
            "type": "string"
          },
          "input_revision": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "input_revision"
        ],
        "additionalProperties": false
      },
      "OutlineSave": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "pages": {
            "type": "array",
            "minItems": 5,
            "maxItems": 20,
            "items": {
              "$ref": "./schemas/outline.schema.json#/$defs/OutlinePageDraft"
            }
          },
          "input_revision": {
            "type": "integer",
            "minimum": 0,
            "description": "提交端保留的材料版本；提供时服务端额外检查 input_revision，提纲始终以 revision 做 CAS，确认时再次核对材料版本。"
          },
          "page_count": {
            "type": "integer",
            "minimum": 5,
            "maximum": 20,
            "description": "客户端草稿页数；服务端以校验后的 pages.length 为准。"
          }
        },
        "required": [
          "revision",
          "pages"
        ],
        "additionalProperties": false
      },
      "OutlineConfirm": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "input_revision": {
            "type": "integer",
            "minimum": 0
          },
          "deck_revision": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "revision",
          "input_revision"
        ],
        "additionalProperties": false
      },
      "SourceCreate": {
        "type": "object",
        "properties": {
          "kind": {
            "enum": [
              "topic",
              "text"
            ]
          },
          "text": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200000
          },
          "input_revision": {
            "type": "integer",
            "minimum": 0
          }
        },
        "required": [
          "kind",
          "text",
          "input_revision"
        ],
        "additionalProperties": false
      },
      "ThemeCommand": {
        "type": "object",
        "properties": {
          "theme_id": {
            "type": "string"
          },
          "theme_revision": {
            "type": "integer",
            "minimum": 0
          },
          "theme_overrides": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/ThemeOverrides"
              },
              {
                "type": "null"
              }
            ]
          },
          "overrides": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/ThemeOverrides"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "theme_revision"
        ],
        "additionalProperties": false
      },
      "FlexState": {
        "type": "object",
        "properties": {
          "revision": {
            "type": "integer",
            "minimum": 0
          },
          "blocks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 200,
            "items": {
              "oneOf": [
                {
                  "$ref": "./schemas/content.schema.json#/$defs/TextBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/BulletsBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/KpiBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/TableBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/ChartBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/ImageBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/CalloutBlock"
                },
                {
                  "$ref": "./schemas/content.schema.json#/$defs/CardsBlock"
                }
              ]
            }
          },
          "layout_tree": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/LayoutTree"
              },
              {
                "type": "null"
              }
            ]
          },
          "layout_mode": {
            "enum": [
              "fixed",
              "flex"
            ]
          },
          "layout_id": {
            "type": "string"
          }
        },
        "required": [
          "revision",
          "blocks",
          "layout_tree"
        ],
        "additionalProperties": false
      },
      "ExecutionSummary": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "model": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "prompt_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "parameters_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "usage_missing_reason": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "elapsed_ms": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "input_tokens": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "output_tokens": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "total_tokens": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "model_calls": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "tool_rounds": {
            "type": "integer",
            "minimum": 0,
            "maximum": 100000000
          },
          "usage_status": {
            "enum": [
              "available",
              "partial",
              "unavailable",
              "not_applicable"
            ]
          }
        },
        "description": "实际调用的最小审计摘要；缺失用量省略数字并说明状态，不填假0，不含材料、提示词或机密。"
      },
      "ExportVerificationFailure": {
        "type": "object",
        "additionalProperties": false,
        "description": "仅导出任务的PPTX_VERIFY_FAILED非重试终态可携带；passed必须false，expected_slide_count与不可变快照一致，报告不进入审计摘要或SSE。",
        "required": [
          "passed",
          "issues",
          "slide_count",
          "expected_slide_count",
          "diagnostics_truncated",
          "total_issues"
        ],
        "properties": {
          "passed": {
            "const": false
          },
          "issues": {
            "type": "array",
            "minItems": 1,
            "maxItems": 2000,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": [
                "check",
                "slide_index",
                "shape",
                "message"
              ],
              "properties": {
                "check": {
                  "enum": [
                    "bounds",
                    "canvas_size",
                    "content_integrity",
                    "full_page_picture",
                    "native_chart",
                    "native_image",
                    "native_table",
                    "open",
                    "page_count",
                    "speaker_notes",
                    "text_frame"
                  ]
                },
                "slide_index": {
                  "type": [
                    "integer",
                    "null"
                  ],
                  "minimum": 1,
                  "maximum": 40
                },
                "shape": {
                  "type": [
                    "string",
                    "null"
                  ],
                  "maxLength": 200
                },
                "message": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 1000
                }
              }
            }
          },
          "slide_count": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1000
          },
          "expected_slide_count": {
            "type": "integer",
            "minimum": 1,
            "maximum": 40
          },
          "diagnostics_truncated": {
            "type": "boolean"
          },
          "total_issues": {
            "type": "integer",
            "minimum": 1,
            "maximum": 1000000
          }
        }
      },
      "SampleSlideIds": {
        "type": "object",
        "minProperties": 1,
        "maxProperties": 40,
        "propertyNames": {
          "pattern": "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        },
        "additionalProperties": {
          "type": "string",
          "minLength": 1,
          "maxLength": 128
        },
        "description": "仅样例响应提供正式页UUID到原目录样例页ID的完整映射；目录版本、页数、唯一身份和1起位置关系由中心校验，不猜测或重写质量问题。"
      },
      "SampleQualityResponse": {
        "type": "object",
        "required": [
          "catalog_version",
          "sample_slide_ids"
        ],
        "properties": {
          "catalog_version": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128
          },
          "sample_slide_ids": {
            "$ref": "#/components/schemas/SampleSlideIds"
          },
          "jobId": {
            "type": "string",
            "minLength": 1
          },
          "job_id": {
            "type": "string",
            "minLength": 1
          },
          "state": {
            "type": "string",
            "minLength": 1
          },
          "status": {
            "type": "string",
            "minLength": 1
          },
          "can_export": {
            "type": "boolean"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "fonts_available": {
            "type": "boolean"
          }
        },
        "anyOf": [
          {
            "required": [
              "jobId",
              "job_id",
              "state",
              "status"
            ]
          },
          {
            "required": [
              "can_export",
              "issues"
            ]
          }
        ],
        "description": "排队/运行接收和当前缓存报告均附两项样例元数据。异步完成后重新GET当前报告；不把任务旧output当当前缓存。辅助字段不写入普通质量、正式报告正文、任务、SSE或审计。"
      }
    }
  }
}

              "maxLength": 128
            }
          }
        ],
        "responses": {
          "200": {
            "description": "正式业务结果；任务接收不表示算法已完成",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer"
                    },
                    "msg": {
                      "type": "string"
                    },
                    "data": {}
                  }
                }
              }
            }
          },
          "401": {

        "security": [
          {
            "RuoYiBearer": []
          }
        ],
        "parameters": [
          {
            "in": "query",
            "name": "pageNum",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "default": 1
            }
          },
          {
            "in": "query",
            "name": "pageSize",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "in": "query",
            "name": "status",
            "schema": {
              "type": "string"
            }
          },
          {
            "in": "query",
            "name": "q",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "正式业务结果；任务接收不表示算法已完成",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "code": {
                      "type": "integer"
                    },
                    "msg": {
                      "type": "string"
                    },
                    "data": {},
                    "rows": {
                      "type": "array",
                      "items": {
                        "type": "object"
                      }
                    },
                    "total": {
                      "type": "integer",
                      "minimum": 0
                    }
                  }
                }
              }
            }
          },
          "401": {
            "description": "身份无效或会话过期"
          },
          "403": {
            "description": "无动作权限或服务scope"
          },
          "404": {
            "description": "未知或他人资源"
          },
          "409": {
            "description": "版本/状态/幂等正文冲突，保留currentRevision及草稿"
          },
          "422": {
            "description": "字段或结构非法"
          },
          "503": {
            "description": "依赖不可用，无正式副作用"
          }
        }
      },
      "post": {
        "operationId": "post_aippt_projects",
        "summary": "创建演示文稿",

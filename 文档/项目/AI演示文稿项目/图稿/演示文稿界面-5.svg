<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g font-family="Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="10" fill="#f4f5ef" stroke="#f4f5ef"/><text x="28" y="38" font-size="27" fill="#25392f">5. 导出与放映 · 保留原对话框和覆盖层</text><text x="28" y="72" font-size="17" fill="#647469">ExportDialog / PresentMode · 仍在原编辑工作区</text><rect x="24" y="92" width="1392" height="66" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="48" y="133" font-size="22" fill="#25392f">AI 演示文稿   ·   WorkbenchHeader</text><text x="1010" y="133" font-size="18" fill="#25392f">原操作/用户菜单保留</text><rect x="24" y="180" width="1392" height="553" rx="10" fill="#e9eee8" stroke="#d5ddd8"/><rect x="180" y="215" width="630" height="480" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="200" y="253" font-size="23" fill="#25392f">原 ExportDialog</text><text x="200" y="291" font-size="18" fill="#25392f">等待当前页/主题保存完成</text><text x="200" y="323" font-size="18" fill="#25392f">质量检查：错误阻断，警告显示</text><text x="200" y="355" font-size="18" fill="#25392f">使用同版本不可变导出快照</text><text x="200" y="387" font-size="18" fill="#25392f">排队 / 构造 / PPTX回读 / 失败原因</text><text x="200" y="419" font-size="18" fill="#25392f">成功后下载原生可编辑PPTX</text><rect x="840" y="215" width="490" height="480" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="860" y="253" font-size="23" fill="#25392f">原 PresentMode</text><text x="860" y="291" font-size="18" fill="#25392f">已就绪页原SlideView渲染</text><text x="860" y="323" font-size="18" fill="#25392f">上一页 / 下一页 / 首页 / 末页</text><text x="860" y="355" font-size="18" fill="#25392f">点击 / 键盘 / 全屏 / 退出</text><text x="860" y="387" font-size="18" fill="#25392f">退出恢复原选页与焦点</text><text x="860" y="419" font-size="18" fill="#25392f">保留原浏览器全屏退化</text><rect x="24" y="774" width="1392" height="102" rx="10" fill="#e4efe6" stroke="#d5ddd8"/><text x="44" y="810" font-size="19" fill="#25392f">接入改动：导出从同步端点适配中心异步任务；私有下载带鉴权并释放blob</text><text x="44" y="845" font-size="17" fill="#25392
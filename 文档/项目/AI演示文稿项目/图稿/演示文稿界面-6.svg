<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g font-family="Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="10" fill="#f4f5ef" stroke="#f4f5ef"/><text x="28" y="38" font-size="27" fill="#25392f">6. 登录、加载与保存异常 · 局部接入状态</text><text x="28" y="72" font-size="17" fill="#647469">RequireAuth / AuthPage / 原保存队列错误状态</text><rect x="24" y="92" width="1392" height="66" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="48" y="133" font-size="22" fill="#25392f">AI 演示文稿   ·   AppShell</text><text x="1010" y="133" font-size="18" fill="#25392f">原操作/用户菜单保留</text><rect x="45" y="190" width="430" height="535" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="65" y="228" font-size="23" fill="#25392f">平台身份</text><text x="65" y="266" font-size="18" fill="#25392f">有效同源会话 → getInfo</text><text x="65" y="298" font-size="18" fill="#25392f">无会话 → 平台登录引导</text><text x="65" y="330" font-size="18" fill="#25392f">安全深链存在sessionStorage</text><text x="65" y="362" font-size="18" fill="#25392f">URL不传Token</text><text x="65" y="394" font-size="18" fill="#25392f">403拒绝 / 退出清缓存</text><text x="65" y="426" font-size="18" fill="#25392f">不恢复原注册/JWT</text><rect x="500" y="190" width="430" height="535" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="520" y="228" font-size="23" fill="#25392f">异步与断线</text><text x="520" y="266" font-size="18" fill="#25392f">保留原加载/进度界面</text><text x="520" y="298" font-size="18" fill="#25392f">中心SSE序号 / 心跳 / 退避</text><text x="520" y="330" font-size="18" fill="#25392f">断线后查询快照及终态</text><text x="520" y="362" font-size="18" fill="#25392f">不重复提交生成/计费</text><text x="520" y="394" font-size="18" fill="#25392f">局部失败保留成功页</text><text x="520" y="426" font-size="18" fill="#25392f">不显示虚假成功</text><rect x="955" y="190" width="430" height="535" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="975" y="228" font-size="23" fill="#25392f">保存与离开</text><text x="975" y="266" font-size="18" fill="#25392f">原每页串行保存</text><text x="975" y="298" font-size="18" fill="#25392f">未知回执保留幂等键</text><text x="975" y="330" font-size="18" fill="#25392f">409暂停并保留草稿</text><text x="975" y="362" font-size="18" fill="#25392f">明确重试 / 回读新版本</text><text x="975" y="394" font-size="18" fill="#25392f">切React路由 / 关闭标签</text><text x="975" y="426" font-size="18" fill="#25392f">beforeunload提示未保存</text><rect x="24" y="774" width="1392" height="102" rx="10" fill="#e4efe6" stroke="#d5ddd8"/><text x="44" y="810" font-size="19" fill="#25392f">接入改动：权限、任务、保存和资源错误只补在原组件；正式真相留Java/MySQL</text><text x="44" y="845" font-size="17" fill="#25392f">示意图依据原组件结构；精确样式和实际业务效果必须运行原React接入后取证。</text></g></svg>
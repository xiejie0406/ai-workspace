<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g font-family="Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="10" fill="#f4f5ef" stroke="#f4f5ef"/><text x="28" y="38" font-size="27" fill="#25392f">7. 必要补齐 · 原组件上的材料/参数与样例对话框</text><text x="28" y="72" font-size="17" fill="#647469">拟新增ProjectMaterialsDialog / SamplePanel · 保留原工作区</text><rect x="24" y="92" width="1392" height="66" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="48" y="133" font-size="22" fill="#25392f">AI 演示文稿   ·   AppShell</text><text x="1010" y="133" font-size="18" fill="#25392f">原操作/用户菜单保留</text><rect x="24" y="178" width="1392" height="559" rx="10" fill="#e9eee8" stroke="#d5ddd8"/><rect x="100" y="210" width="730" height="502" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="120" y="248" font-size="23" fill="#25392f">材料与参数 · 原Dialog / TextField / PillSelect</text><text x="120" y="286" font-size="18" fill="#25392f">项目名称 / 受众 / 语气 / 页数 / 文字量</text><text x="120" y="318" font-size="18" fill="#25392f">已确认：内容字段锁定 · 允许取消确认后改材料</text><text x="120" y="350" font-size="18" fill="#25392f">来源列表：名称 / 解析状态 / 警告 / 删除</text><text x="120" y="382" font-size="18" fill="#25392f">展开章节：稳定sectionId / 定位 / 字数</text><text x="120" y="414" font-size="18" fill="#25392f">补传文档 / 粘贴文字：逐份状态，部分失败保留</text><text x="120" y="446" font-size="18" fill="#25392f">保存 / 关闭：等待队列，409保留草稿</text><rect x="860" y="210" width="490" height="502" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="880" y="248" font-size="23" fill="#25392f">样例 · 原ThemePanel按钮进入</text><text x="880" y="286" font-size="18" fill="#25392f">四主题 / 11布局 / 当前catalogVersion</text><text x="880" y="318" font-size="18" fill="#25392f">使用原SlideView预览样例</text><text x="880" y="350" font-size="18" fill="#25392f">检查：等待实际质量结果</text><text x="880" y="382" font-size="18" fill="#25392f">错误阻断 / 警告确认</text><text x="880" y="414" font-size="18" fill="#25392f">导出：中心任务完成后私有下载</text><text x="880" y="446" font-size="18" fill="#25392f">关闭回原主题面板，不新建项目</text><rect x="24" y="774" width="1392" height="102" rx="10" fill="#e4efe6" stroke="#d5ddd8"/><text x="44" y="810" font-size="19" fill="#25392f">接入改动：这些是承接原后端能力的必要新组件，不能冒称原前端已有</text><text x="44" y="845" font-size="17" fill="#25392f">材料对话框不增提纲第三栏；样例不新建独立路由，也不把样例计入个人生成。</text></g></svg>
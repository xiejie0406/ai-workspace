<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><g font-family="Microsoft YaHei, sans-serif"><rect x="0" y="0" width="1440" height="900" rx="10" fill="#f4f5ef" stroke="#f4f5ef"/><text x="28" y="38" font-size="27" fill="#25392f">2. 新建演示文稿 · 原表单与输入方式</text><text x="28" y="72" font-size="17" fill="#647469">/aippt-web/create · CreatePage + AppShell</text><rect x="24" y="92" width="1392" height="66" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="48" y="133" font-size="22" fill="#25392f">AI 演示文稿   ·   AppShell</text><text x="1010" y="133" font-size="18" fill="#25392f">原操作/用户菜单保留</text><text x="440" y="213" font-size="31" fill="#25392f">想做一份什么 PPT？</text><rect x="330" y="242" width="780" height="108" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="350" y="280" font-size="23" fill="#25392f">一句主题   |   粘贴文字   |   文档上传</text><rect x="330" y="367" width="780" height="264" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="350" y="405" font-size="23" fill="#25392f">原 textarea / FileDrop 输入区域</text><text x="350" y="443" font-size="18" fill="#25392f">主题500字 / 文本20000字</text><text x="350" y="475" font-size="18" fill="#25392f">保留原输入与拖放组件；名称原规则推导</text><text x="350" y="507" font-size="18" fill="#25392f">文件列表 / 移除；生成中步骤与错误提示</text><rect x="330" y="648" width="780" height="103" rx="10" fill="#fff" stroke="#d5ddd8"/><text x="350" y="686" font-size="23" fill="#25392f">原底部参数行</text><text x="350" y="724" font-size="18" fill="#25392f">页数 / 排版 / 文字量 / 语气 / 受众   → 生成大纲</text><rect x="24" y="774" width="1392" height="102" rx="10" fill="#e4efe6" stroke="#d5ddd8"/><text x="44" y="810" font-size="19" fill="#25392f">接入改动：原居中单栏保留；局部展示异步解析，失败保留已成功项目</text><text x="44" y="845" font-size="17" fill="#25392f">主题在原提纲页右栏选择；材料补传/章节与参数操作通过必要新增对话框承接。</text></g></svg>
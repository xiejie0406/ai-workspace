  responses:
    BadRequest:
      description: 输入无效。部分共享异常也可能用 HTTP 200 + Ajax code 返回；消费者必须检查 code。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AjaxResult'
    Unauthorized:
      description: 共享登录已失效或未登录。部分共享异常也可能用 HTTP 200 + Ajax code 返回；消费者必须检查 code。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AjaxResult'
    Forbidden:
      description: 权限、资格或资源范围拒绝。部分共享异常也可能用 HTTP 200 + Ajax code 返回；消费者必须检查 code。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AjaxResult'
    Conflict:
      description: 行版本、状态或业务重复动作冲突。部分共享异常也可能用 HTTP 200 + Ajax code 返回；消费者必须检查 code。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AjaxResult'
    RateLimited:
      description: 超出服务端窗口限制。部分共享异常也可能用 HTTP 200 + Ajax code 返回；消费者必须检查 code。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AjaxResult'
      headers:
        Retry-After:
          schema:
            type: integer
            format: int64
            minimum: 1
          description: 重试等待秒数；响应 errorCode=RATE_LIMITED，retryAfter 同值。
    Unavailable:
      description: 业务数据库暂不可用。部分共享异常也可能用 HTTP 200 + Ajax code 返回；消费者必须检查 code。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AjaxResult'

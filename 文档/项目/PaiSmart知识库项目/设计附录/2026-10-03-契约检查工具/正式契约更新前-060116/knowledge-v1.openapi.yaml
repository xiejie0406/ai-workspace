          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-ruoyi-permissions:
      - paismart:document:remove
      x-ruoyi-permission-mode: all
      parameters:
      - name: id
        in: path
        required: true
        schema: *id001
      - name: rowVersion
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      description: 返回当前 Document 元数据，处理作业在后台排队；不是 Job 或 JobSummary。版本指 rowVersion。 rowVersion query 优先，否则 If-Match；至少一项必需，If-Match
        接受数字或带引号的数字。

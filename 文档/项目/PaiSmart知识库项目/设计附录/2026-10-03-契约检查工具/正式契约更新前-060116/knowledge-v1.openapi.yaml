openapi: 3.0.3
info:
  title: PaiSmart 知识库真实 HTTP 契约
  version: 1.0.0
  description: 对应当前若依 PaiSmart 模块。共享 Bearer 登录、按钮权限和服务端空间 ACL；不建立第二套认证。源码范围含当前所有 /paismart Controller 映射及现有别名。默认外发与真实运维执行可关闭，路径存在不表示配置或业务联机通过。
servers:
- url: /
  description: 若依后端根地址；开发环境由既有 /dev-api 代理转发。
security:
- BearerAuth: []
paths:
  /paismart/documents:
    get:
      operationId: Document_list_get_paismart_documents
      summary: 查询文档
      tags:
      - Document
      x-source: ruoyi-backend/ruoyi-paismart/src/main/java/com/ruoyi/paismart/api/DocumentController.java:29
      responses:
        '200':
          description: 成功与业务错误均须检查 code；成功 data/rows 结构如下。
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/DocumentPage'
                - $ref: '#/components/schemas/AjaxFailure'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
      x-ruoyi-permissions:
      - paismart:document:list
      x-ruoyi-permission-mode: all
      parameters:
      - name: title
        in: query
        required: false
        schema:
          type: string
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: spaceId
        in: query
        required: false
        schema:
          type: string
      - name: visibility
        in: query
        required: false
        schema: &id009
          type: string
          enum:
          - PRIVATE
          - ORGANIZATION
          - PUBLIC
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: pageNum
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          format: int64
          default: 20
          minimum: 1
          maximum: 100

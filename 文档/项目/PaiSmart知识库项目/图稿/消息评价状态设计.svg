<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1100" viewBox="0 0 1260 1100"><rect width="1260" height="1100" fill="#f5f7fa"/><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#303133;font-size:16px}.heading{font-size:26px;font-weight:700}.card{fill:white;stroke:#dcdfe6}.title{font-size:18px;font-weight:700}.hint{font-size:14px;fill:#606266}.selected{fill:#409eff;stroke:#409eff}.normal{fill:white;stroke:#dcdfe6}.disabled{fill:#f4f4f5;stroke:#e4e7ed}.white{fill:white}.muted{fill:#909399}.error{fill:#c45656}</style><text x="34" y="45" class="heading">消息评价状态设计</text><text x="34" y="76" class="hint">设计稿 · 沿用知识问答中的“有帮助／需改进”按钮 · 非产品截图／非业务验收证据</text><rect x="34" y="104" width="578" height="267" rx="8" class="card"/><text x="52" y="134" class="title">1. 读取回答 · 尚未评价</text><text x="52" y="169" class="hint">入口：知识问答 → 已保存的知识回答 → 消息操作栏</text><text x="52" y="205">答案：报销申请应在出差结束后五个工作日内提交。</text><text x="52" y="234" class="hint">[1] 差旅报销制度 · 第 2 页 · 已核验</text><rect x="52" y="257" width="112" height="34" rx="4" class="normal"/><text x="68" y="280" class="">复制回答</text><rect x="178" y="257" width="112" height="34" rx="4" class="normal"/><text x="194" y="280" class="">有帮助</text><rect x="304" y="257" width="112" height="34" rx="4" class="normal"/><text x="320" y="280" class="">需改进</text><text x="52" y="321" class="hint">未评价 · 版本 0</text><text x="52" y="349" class="hint">选中状态同时用文字与 aria-pressed 表达；复制和引用保持原行为。</text><rect x="646" y="104" width="578" height="267" rx="8" class="card"/><text x="664" y="134" class="title">2. 当前评价 · 刷新后仍可见</text><text x="664" y="169" class="hint">入口：知识问答 → 已保存的知识回答 → 消息操作栏</text><text x="664" y="205">同一条回答；服务端返回消息、生成与当前评价。</text><text x="664" y="234" class="hint">[1] 差旅报销制度 · 第 2 页 · 已核验</text><rect x="664" y="257" width="112" height="34" rx="4" class="normal"/><text x="680" y="280" class="">复制回答</text><rect x="790" y="257" width="112" height="34" rx="4" class="selected"/><text x="806" y="280" class="white">有帮助</text><rect x="916" y="257" width="112" height="34" rx="4" class="normal"/><text x="932" y="280" class="">需改进</text><text x="664" y="321" class="hint">当前评价：有帮助 · 版本 2</text><text x="664" y="349" class="hint">选中状态同时用文字与 aria-pressed 表达；复制和引用保持原行为。</text><rect x="34" y="394" width="578" height="267" rx="8" class="card"/><text x="52" y="424" class="title">3. 需改进 · 填写原因及保存</text><text x="52" y="459" class="hint">入口：知识问答 → 已保存的知识回答 → 消息操作栏</text><text x="52" y="495">弹窗：请说明需要改进的内容（必填，最多1000字）。</text><text x="52" y="524" class="hint">[1] 差旅报销制度 · 第 2 页 · 已核验</text><rect x="52" y="547" width="112" height="34" rx="4" class="normal"/><text x="68" y="570" class="">复制回答</text><rect x="178" y="547" width="112" height="34" rx="4" class="disabled"/><text x="194" y="570" class="muted">有帮助</text><rect x="304" y="547" width="112" height="34" rx="4" class="disabled"/><text x="320" y="570" class="muted">需改进</text><text x="52" y="611" class="hint">正在保存评价… 两个按钮暂不可重复提交</text><text x="52" y="639" class="hint">原因：请补充提交材料和审批时限。</text><rect x="646" y="394" width="578" height="267" rx="8" class="card"/><text x="664" y="424" class="title">4. 相同评价 · 核对当前回执</text><text x="664" y="459" class="hint">入口：知识问答 → 已保存的知识回答 → 消息操作栏</text><text x="664" y="495">保存成功，回执仍属于同一消息及生成。</text><text x="664" y="524" class="hint">[1] 差旅报销制度 · 第 2 页 · 已核验</text><rect x="664" y="547" width="112" height="34" rx="4" class="normal"/><text x="680" y="570" class="">复制回答</text><rect x="790" y="547" width="112" height="34" rx="4" class="selected"/><text x="806" y="570" class="white">有帮助</text><rect x="916" y="547" width="112" height="34" rx="4" class="normal"/><text x="932" y="570" class="">需改进</text><text x="664" y="611" class="hint">反馈已记录，当前评价未变化</text><text x="664" y="639" class="hint">选中状态同时用文字与 aria-pressed 表达；复制和引用保持原行为。</text><rect x="34" y="684" width="578" height="267" rx="8" class="card"/><text x="52" y="714" class="title">5. 历史关联未知 · 不提交</text><text x="52" y="749" class="hint">入口：知识问答 → 已保存的知识回答 → 消息操作栏</text><text x="52" y="785">保留原回答与引用，解释暂停评价的原因。</text><text x="52" y="814" class="hint">[1] 差旅报销制度 · 第 2 页 · 已核验</text><rect x="52" y="837" width="112" height="34" rx="4" class="normal"/><text x="68" y="860" class="">复制回答</text><rect x="178" y="837" width="112" height="34" rx="4" class="disabled"/><text x="194" y="860" class="muted">有帮助</text><rect x="304" y="837" width="112" height="34" rx="4" class="disabled"/><text x="320" y="860" class="muted">需改进</text><text x="52" y="901" class="hint">此历史回答的生成关联尚未确认，暂不能评价。</text><text x="52" y="929" class="hint">选中状态同时用文字与 aria-pressed 表达；复制和引用保持原行为。</text><rect x="646" y="684" width="578" height="267" rx="8" class="card"/><text x="664" y="714" class="title">6. 保存失败 · 保留当前评价</text><text x="664" y="749" class="hint">入口：知识问答 → 已保存的知识回答 → 消息操作栏</text><text x="664" y="785">当前选择仍为有帮助；失败不会伪装成功。</text><text x="664" y="814" class="hint">[1] 差旅报销制度 · 第 2 页 · 已核验</text><rect x="664" y="837" width="112" height="34" rx="4" class="normal"/><text x="680" y="860" class="">复制回答</text><rect x="790" y="837" width="112" height="34" rx="4" class="selected"/><text x="806" y="860" class="white">有帮助</text><rect x="916" y="837" width="112" height="34" rx="4" class="normal"/><text x="932" y="860" class="">需改进</text><text x="664" y="901" class="hint error">评价版本已变化，请重新读取回答后再试。</text><text x="664" y="929" class="hint">选中状态同时用文字与 aria-pressed 表达；复制和引用保持原行为。</text><rect x="34" y="999" width="1190" height="70" rx="6" fill="#ecf5ff"/><text x="48" y="1027" class="hint">消息切换保护：A 弹窗／保存中 → B → A，旧 A 回执仍失效；新消息可以独立保存。</text><text x="48" y="1054" class="hint">保存前冻结消息、生成与评价版本；未知关联、串号回执或版本冲突均不修改当前显示。</text></svg>
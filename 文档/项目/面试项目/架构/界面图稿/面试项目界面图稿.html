background:#172541;color:white;border-radius:9px;padding:12px 20px;max-width:90%;z-index:10;display:none;pointer-events:none}button,select,a,summary{touch-action:manipulation}button:hover{transition:border-color .15s,color .15s}

<script>
'use strict';
const pages={home:'首页',login:'登录',questions:'题库',question:'题目详情',setup:'面试准备',plan:'开始前确认','text-room':'文字对话房间','voice-room':'语音对话房间',report:'结束总结',history:'我的记录','admin-home':'管理工作台','admin-catalog':'题库管理','admin-editor':'题目编辑','admin-review':'内容审核','admin-strategy':'对话策略','admin-sessions':'会话运行','admin-reports':'总结与复核','admin-capabilities':'模型与语音能力','admin-governance':'数据与权限'};
const states={home:{normal:'正常',empty:'没有历史'},login:{normal:'正常',error:'登录失败'},questions:{normal:'已发布内容',empty:'无匹配题',error:'读取失败'},question:{normal:'详情与练习',saving:'保存中'},setup:{normal:'能力待核对',ready:'示例能力可用',error:'模型未就绪'},plan:{normal:'确认开始',error:'准备失败'},'text-room':{normal:'反问得到回应',loading:'正在回应',error:'模型回复失败',paused:'暂停',correct:'修订前文',handoff:'面试官交接',source:'原话引用定位',end:'结束草稿确认'},'voice-room':{normal:'面试官自动播报',ready:'开始前授权',opening:'HR主动开场',listening:'正在听你说',endpoint:'等你说完',recognizing:'整理最终识别',responding:'面试官正在回应',manual:'手动确认转写',muted:'暂时静音',error:'识别失败',blocked:'播放被阻止',speaking:'正在播报',denied:'麦克风被拒绝',paused:'暂停',end:'结束草稿确认'},report:{normal:'有依据总结',generating:'总结生成中',partial:'部分完成',error:'生成失败',empty:'内容不足'},history:{normal:'本人记录',empty:'暂无记录'},'admin-home':{normal:'工作台'},'admin-catalog':{normal:'版本列表',empty:'无内容'},'admin-editor':{normal:'编辑草稿',conflict:'版本冲突'},'admin-review':{normal:'审核',private:'无审核权限'},'admin-strategy':{normal:'策略草稿',error:'校验失败'},'admin-sessions':{normal:'脱敏会话',error:'回复任务失败'},'admin-reports':{normal:'阶段与复核',private:'无正文权限'},'admin-capabilities':{normal:'配置与实调分开',error:'当前识别失败'},'admin-governance':{normal:'治理任务',private:'无处理权限'}};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=t=>'<section class="card">'+t+'</section>';
const tag=(t,c='')=>'<span class="tag '+c+'">'+t+'</span>';
const btn=(t,c='',a='note',disabled=false)=>'<button type="button" class="'+c+'" data-action="'+a+'"'+(disabled?' disabled':'')+'>'+t+'</button>';
const link=(p,t,c='')=>'<a href="#'+p+'" class="'+c+'">'+t+'</a>';
const heading=(t,p,a='')=>'<div class="heading"><div><div class="eyebrow">面试教练 / 设计示例</div><h1>'+t+'</h1><p class="muted">'+p+'</p></div>'+a+'</div>';
const notice=(t,c='')=>'<div class="notice '+c+'">'+t+'</div>';
const field=(label,value='',help='',type='text')=>'<label class="field">'+label+(type==='textarea'?'<textarea>'+esc(value)+'</textarea>':type==='select'?'<select>'+value.split('|').map(v=>'<option>'+esc(v)+'</option>').join('')+'</select>':'<input type="'+type+'" value="'+esc(value)+'">')+(help?'<span class="help">'+help+'</span>':'')+'</label>';
const checks=t=>'<label class="check"><input type="checkbox">'+t+'</label>';
const actions=(...x)=>'<div class="actions">'+x.join('')+'</div>';
const table=(heads,rows)=>'<div class="tablewrap"><table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
const empty=(t,p)=>'<div class="empty"><h2>'+t+'</h2><p class="muted">'+p+'</p></div>';
const mic='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></svg>';
let current='text-room',state='normal',preferredState='normal';
function message(role,text,meta=''){
 const user=role==='你',hr=role==='HR 面试官';
 return '<div class="message '+(user?'user':'')+'">'+(!user?'<span class="badge '+(hr?'hr':'')+'" aria-hidden="true">'+(hr?'HR':'技术')+'</span>':'')+'<div class="bubblewrap"><div class="speaker"><strong>'+role+'</strong>'+(meta?'<span>'+meta+'</span>':'')+'</div><div class="bubble">'+text+'</div></div></div>';
}
function room(voice,s){
 const paused=s==='paused';
 let msgs=message('技术面试官','沿着你刚才的订单项目聊：唯一键已写入，但业务结果还没完成时，重试请求怎么处理？','当前话题 · 幂等与状态');
 msgs+=message('你','你这里说的重试，是指用户重复点击，还是消息重新投递？','已保存 · 你在反问');
 if(s==='loading')msgs+='<div class="system" role="status">技术面试官正在回应你的问题…</div>';
 else if(s==='error'&&!voice)msgs+=notice('这次回复未完成。你的发言已保存，当前话题仍是“幂等与状态”。','error');
 else msgs+=message('技术面试官','这轮先讨论用户在接口超时后重复点击。你提到“唯一键＋查询原结果”，我们就沿着这个方案看处理中、成功和失败三种状态。你当时怎样区分？','先回应你的反问，再继续交流');
 if(s==='source')msgs=message('HR 面试官','先聊一个你最熟悉的项目。你主要负责什么？','开场')+message('你','订单系统，我负责重复请求处理。','报告引用的原话')+message('HR 面试官','主要来自用户操作还是系统重试？','经历澄清')+message('你','接口超时后用户重复点。我用数据库唯一键，并让重试查询原结果。','报告引用的原话')+'<div class="system">协调 Agent：以上两段为报告引用，后续技术对话接续这一项目</div>'+msgs;
 if(s==='correct')msgs+=message('你','补充一下，刚才说 Redis 不准确，是 MySQL 里记录处理状态。','更正前文 · 已保存')+message('技术面试官','明白，已按 MySQL 的状态记录理解。我们继续看事务失败时如何恢复。','采用修订后的事实');
 if(s==='handoff')msgs=message('HR 面试官','你已经说明自己负责订单重复请求和回读结果。接下来请技术面试官沿着这个项目继续。','经历表达')+'<div class="system">协调 Agent：已共享本场项目背景，技术面试官接续交流</div>'+message('技术面试官','你刚才说用数据库唯一键处理重复点击。唯一键已写入但业务还在执行时，接口返回什么？','接续同一段经历');
 let error='';
 if(voice&&s==='error')error=notice('<strong>这段语音未能识别</strong><br>已确认对话都在。可以重试本段，或直接输入文字继续。'+actions(btn('重试本段','primary','retry'),btn('重录','','listen'),btn('输入文字','','text'))+'<details><summary>查看排障信息</summary><span class="small">识别响应异常 · PROVIDER_BAD_RESPONSE<br>关联编号：设计样例-ASR-01；具体根因需后台定位</span></details>','error');
 if(voice&&s==='blocked')error=notice('浏览器尚未允许播放。点击播放这段回复，或直接阅读上方文字。'+actions(btn('播放这段回复','primary','speak')),'warn');
 if(voice&&s==='denied')error=notice('麦克风权限尚未授予。允许权限后可重试，或在原会话输入文字。'+actions(btn('重新检查','','note'),btn('输入文字','primary','text')),'warn');
 if(paused)error=notice('面试已暂停。采集和播报均已停止；已确认对话保留。'+actions(btn('继续交流','primary','resume')),'warn');

const pageSelect=document.getElementById('page'),stateSelect=document.getElementById('state');
const demoStep=document.createElement('button');demoStep.id='demo-step';demoStep.textContent='演示下一步';demoStep.type='button';document.querySelector('.designbar').append(demoStep);
demoStep.addEventListener('click',()=>{const sequence=['ready','opening','listening','endpoint','recognizing','responding','normal'];let index=sequence.indexOf(state);changeState(sequence[index<0?0:index+1]||'listening');});
Object.entries(pages).forEach(([id,label])=>{const o=document.createElement('option');o.value=id;o.textContent=label;pageSelect.append(o)});
function render(){
 demoStep.hidden=current!=='voice-room';
 pageSelect.value=current;stateSelect.innerHTML='';Object.entries(states[current]).forEach(([id,label])=>{const o=document.createElement('option');o.value=id;o.textContent=label;stateSelect.append(o)});if(!states[current][state])state='normal';stateSelect.value=state;
 let html=views[current](state);
 if(current.startsWith('admin-'))html='<div class="adminframe"><nav class="side" aria-label="面试管理菜单">'+Object.entries(pages).filter(([p])=>p.startsWith('admin-')).map(([p,t])=>link(p,t,p===current?'active':'')).join('')+'</nav><div>'+html+'</div></div>';
 document.getElementById('content').innerHTML=html+'<footer class="foot">面试项目完整设计 2.0.1 附件 · '+pages[current]+' / '+states[current][state]+' · 所有数据与对话为虚构示例；不表示实现或验收结果。</footer>';
}
function changePage(){const id=location.hash.slice(1);current=pages[id]?id:'text-room';state=preferredState;preferredState='normal';render()}
function changeState(s){if(states[current][s]){state=s;render()}}
let toastTimer;function toast(text){const node=document.getElementById('toast');node.textContent=text;node.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.style.display='none',3500)}
pageSelect.addEventListener('change',()=>{if(location.hash==='#'+pageSelect.value){current=pageSelect.value;state='normal';render()}else location.hash=pageSelect.value});stateSelect.addEventListener('change',()=>{state=stateSelect.value;render()});window.addEventListener('hashchange',changePage);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;
 if(a==='evidence'){e.preventDefault();if(current==='text-room'){changeState('source')}else{preferredState='source';location.hash='text-room'}return}
 if(a==='text'){location.hash='text-room';return}if(a==='voice'){location.hash='voice-room';return}
 if(a==='pause'){changeState('paused');return}if(a==='resume'){changeState('normal');return}if(a==='end'){changeState('end');return}
 if(a==='voice-start'){changeState('opening');toast('设计示例：开始后的自动播报；没有请求权限或实际播音。');return}if(a==='mute'){changeState('muted');return}if(a==='manual'){changeState('manual');return}
 if(a==='listen'){changeState('listening');toast('设计状态：尚未调用麦克风。');return}if(a==='recognize'){changeState('endpoint');return}if(a==='speak'){changeState('speaking');return}
 if(a==='stop'){changeState(current==='voice-room'?'paused':'normal');toast('设计示例：停止当前输出，旧代次不能继续播报。');return}
 if(a==='retry'){changeState('normal');toast('展示恢复后的设计状态；没有实际请求。');return}
 if(a==='send'){const input=document.getElementById('utterance');if(!input.value.trim()){toast('请先输入要发送的内容。');input.focus();return}toast('图稿只展示发送流程，不会调用面试Agent；你的输入未上传。');return}
 toast('此操作仅作设计说明，不会写入数据或调用外部服务。');
});
document.addEventListener('toggle',e=>{if(e.target.matches('.textfallback')&&e.target.open&&current==='voice-room'){const status=document.querySelector('.voice-status');if(status)status.textContent='文字输入已展开 · 自动收音与自动提交暂停';}},true);
document.addEventListener('keydown',e=>{if(e.target.id==='utterance'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();const b=document.querySelector('[data-action="send"]');if(b&&!b.disabled)b.click()}});
document.getElementById('fontScale').addEventListener('change',e=>{document.documentElement.style.fontSize=e.target.value+'px'});
changePage();
</script>
</body></html>

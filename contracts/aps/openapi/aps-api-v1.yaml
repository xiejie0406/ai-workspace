      operationId: getOrderDeliveryReportV1
      summary: 查询订单与产品行生产完成 ETA
      description: 要求 `aps:report:view`；任何必需数据缺失或任务未排产时 ETA 返回 `UNKNOWN`，不得使用已知子集伪造时间。
      parameters:
        - { name: orderId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: 订单交期, content: { application/json: { schema: { $ref: '#/components/schemas/OrderDeliveryReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/reports/order-delivery.csv:
    get:
      tags: [report]
      operationId: exportOrderDeliveryReportV1
      summary: 按相同范围导出订单交期 CSV
      parameters:
        - { name: orderId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: UTF-8 BOM CSV, content: { text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/site:
    get:
      tags:
      - system
      operationId: getApsSiteContextV1
      summary: 读取已登记站点与显示时区
      description: 需要登录。站点未配置时失败；不创建配置或凭据。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApsSiteContext'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/aps/v1/resources/user-candidates:
    get:
      tags:
      - resource
      operationId: listApsUserCandidatesV1
      summary: 查询资源用途的最小用户候选
      description: 需要 aps:resource:add 或 aps:resource:edit。普通负责人只返回本人；管理员/范围管理员仍受平台用户服务数据范围限制，最多100个候选。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsUserCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
  /api/aps/v1/resources/directory:
    get:
      tags:
      - resource
      operationId: getApsResourceDirectoryV1
      summary: 按车间范围读取业务名称目录
      description: 需要资源、工艺、订单、计划、执行或报表的查看权限。不返回用户映射、技能证书或资源私有备注；空范围为空目录。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApsResourceDirectory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/aps/v1/readiness:
    post:
      tags:
      - validation
      operationId: checkApsBusinessPlanReadinessV1
      summary: 按订单、车间和时段检查完整排程输入
      description: 需要 aps:readiness:view 和 aps:order:list。只读可信编译与独立校验；检查时刻由服务器取得，不创建计划、不启动Worker、不保存候选。通过不承诺存在可行解，创建/发布仍须复验。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApsPlanReadiness'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequestInput'
  /api/aps/v1/execution-runs/dispatch-plans:
    get:
      tags:
      - execution
      operationId: listApsDispatchPlansV1
      summary: 查询可派工的正式计划
      description: 需要 aps:execution:start。复用完整计划范围与最近200个版本目录，只映射PUBLISHED版本。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsDispatchPlanOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/aps/v1/execution-runs/dispatch-plans/{id}:
    get:
      tags:
      - execution
      operationId: getApsDispatchPlanV1
      summary: 读取正式作业及剩余可分配量
      description: 需要 aps:execution:start。只返回派工所需字段；旧正式版拒绝，创建派工时重新校验并发余额。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApsDispatchPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
  /api/aps/v1/execution-runs/{id}/report-members:
    get:
      tags:
      - execution
      operationId: getApsRunReportMembersV1
      summary: 读取报工成员和剩余量
      description: 需要 aps:execution:report。成员来自计划关系，无成员时不得手填标识绕过。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsReportMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
  /api/aps/v1/execution-runs/{id}/resource-candidates:
    get:
      tags:
      - execution
      operationId: getApsRunReplacementCandidatesV1
      summary: 查询合法替换资源
      description: 需要 aps:execution:start。复用正式换资源资格、日历、实际占用及当前席位规则，写入时再次检查。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsReplacementResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: replacedResourceId
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: at
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UtcInstant'
  /api/aps/v1/execution-runs/{id}/output-lots/{lotId}/movement-targets:
    get:
      tags:
      - execution
      operationId: getApsRunMovementTargetsV1
      summary: 查询合法物料需求和目标执行单
      description: 需要 aps:execution:report。只返回产出批所属执行单、完整车间范围及来源/物料/单位匹配的目标；最多200项。余额和预留分配仍在原数量事务内复验。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsMovementTarget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: lotId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
  /api/aps/v1/execution-runs/{id}/output-lots/{lotId}/quantity-events:
    get:
      tags:
      - execution
      operationId: getApsRunQuantityEventsV1
      summary: 回查产出批数量及冲正流水
      description: 需要 aps:execution:view。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsQuantityEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      - name: lotId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
  /api/aps/v1/reports/order-candidates:
    get:
      tags:
      - report
      operationId: getApsReportOrderCandidatesV1
      summary: 查询报表用途的最小订单目录
      description: 需要 aps:report:view 或 aps:report:export。沿用订单完整范围，仅返回名称和状态，不增加订单维护权限。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsReportOrderCandidate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: RuoYi access token
  parameters:
    WorkshopId:
      name: workshopId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ResourceObjectId:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RequestId:
      name: requestId
      in: path
      required: true
      description: 幂等计划请求的稳定 UUID；不是 Worker attempt 或租约 token
      schema:
        $ref: '#/components/schemas/Uuid'
    PlanVersionId:
      name: planVersionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ExecutionRunId:
      name: executionRunId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProductionReportId:
      name: reportId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    OutputLotId:
      name: outputLotId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 同一键和同一请求摘要返回原校验结果；同键不同载荷返回 409
      schema:
        type: string
        minLength: 16
        maxLength: 64
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
  responses:
    BadRequest:
      description: 请求字段、枚举、UTC 时间或半开区间无效
      content:
        application/json:
          schema:
            $ref: '../schemas/problem-v1.schema.json'
    Conflict:
      description: 唯一约束冲突或 rowVersion 已过期
      content:
        application/json:
          schema:
            $ref: '../schemas/problem-v1.schema.json'
    Unauthorized:
      description: 缺少或无法验证访问令牌
      content:
        application/json:
          schema:
            $ref: '../schemas/problem-v1.schema.json'
    Forbidden:
      description: 已认证但不具备所需的 `aps:*` 权限
      content:
        application/json:
          schema:
            $ref: '../schemas/problem-v1.schema.json'
  schemas:
    ApsSiteContext:
      type: object
      additionalProperties: false
      required:
      - siteCode
      - zoneId
      properties:
        siteCode:
          type: string
          minLength: 1
          maxLength: 64
        zoneId:
          type: string
    ApsUserCandidate:
      type: object
      additionalProperties: false
      required:
      - userId
      - userName
      - displayName
      properties:
        userId:
          type: string
        userName:
          type: string
        displayName:
          type:
          - string
          - 'null'
    ApsResourceDirectoryEntry:
      type: object
      additionalProperties: false
      required:
      - id
      - workshopId
      - workCenterId
      - code
      - name
      - type
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        workshopId:
          $ref: '#/components/schemas/Uuid'
        workCenterId:
          type:
          - string
          - 'null'
        code:
          type: string
        name:
          type: string
        type:
          enum:
          - PERSON
          - MACHINE
          - WORKSTATION
          - TOOL
        status:
          enum:
          - ACTIVE
          - INACTIVE
          - MAINTENANCE
    ApsResourceDirectory:
      type: object
      additionalProperties: false
      required:
      - workshops
      - centers
      - resources
      properties:
        workshops:
          type: array
          items:
            $ref: '#/components/schemas/Workshop'
        centers:
          type: array
          items:
            $ref: '#/components/schemas/WorkCenter'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ApsResourceDirectoryEntry'
    ApsDraftOrderInput:
      type: object
      additionalProperties: false
      required:
      - rowVersion
      - order
      properties:
        rowVersion:
          $ref: '#/components/schemas/RowVersion'
        order:
          $ref: '#/components/schemas/OrderInput'
    ApsPlanReadiness:
      type: object
      additionalProperties: false
      required:
      - ready
      - checkedAt
      - inputHash
      - issues
      properties:
        ready:
          type: boolean
        checkedAt:
          $ref: '#/components/schemas/UtcInstant'
        inputHash:
          type:
          - string
          - 'null'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
    ApsRunOption:
      type: object
      additionalProperties: false
      required:
      - run
      - jobCode
      - orderNumbers
      - taskNames
      properties:
        run:
          $ref: '#/components/schemas/ExecutionRunSummary'
        jobCode:
          type: string
        orderNumbers:
          type:
          - string
          - 'null'
        taskNames:
          type:
          - string
          - 'null'
    ApsReportMember:
      type: object
      additionalProperties: false
      required:
      - id
      - memberNo
      - taskId
      - taskName
      - plannedQty
      - remainingQty
      - uomCode
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        memberNo:
          type: integer
          minimum: 1
        taskId:
          $ref: '#/components/schemas/Uuid'
        taskName:
          type: string
        plannedQty:
          type: number
          minimum: 0
        remainingQty:
          type: number
          minimum: 0
        uomCode:
          type: string
    ApsReplacementResource:
      type: object
      additionalProperties: false
      required:
      - resourceId
      - code
      - name
      properties:
        resourceId:
          $ref: '#/components/schemas/Uuid'
        code:
          type: string
        name:
          type: string
    ApsMovementTarget:
      type: object
      additionalProperties: false
      required:
      - materialDemandId
      - targetTaskId
      - orderNo
      - taskName
      - remainingDemandQty
      - reservedQty
      - uomCode
      - executionRuns
      properties:
        materialDemandId:
          $ref: '#/components/schemas/Uuid'
        targetTaskId:
          $ref: '#/components/schemas/Uuid'
        orderNo:
          type: string
        taskName:
          type: string
        remainingDemandQty:
          type: number
          minimum: 0
        reservedQty:
          type: number
          minimum: 0
        uomCode:
          type: string
        executionRuns:
          type: array
          items:
            $ref: '#/components/schemas/ApsRunOption'
    ApsDispatchPlanOption:
      type: object
      additionalProperties: false
      required:
      - planVersionId
      - versionNo
      - versionName
      properties:
        planVersionId:
          $ref: '#/components/schemas/Uuid'
        versionNo:
          type: integer
        versionName:
          type: string
    ApsDispatchJob:
      type: object
      additionalProperties: false
      required:
      - jobId
      - jobCode
      - plannedQty
      - remainingQty
      - uomCode
      properties:
        jobId:
          $ref: '#/components/schemas/Uuid'
        jobCode:
          type: string
        plannedQty:
          type: number
          minimum: 0
        remainingQty:
          type: number
          minimum: 0
        uomCode:
          type: string
    ApsDispatchPlan:
      type: object
      additionalProperties: false
      required:
      - planVersionId
      - jobs
      properties:
        planVersionId:
          $ref: '#/components/schemas/Uuid'
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/ApsDispatchJob'
    ApsReportOrderCandidate:
      type: object
      additionalProperties: false
      required:
      - id
      - orderNo
      - customerName
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        orderNo:
          type: string
        customerName:
          type:
          - string
          - 'null'
        status:
          type: string
    ApsQuantityEvent:
      type: object
      additionalProperties: false
      required:
      - id
      - outputLotId
      - itemId
      - materialDemandId
      - executionRunId
      - productionReportId
      - targetTaskId
      - reversalOfId
      - eventType
      - fromBucket
      - toBucket
      - quantity
      - uomCode
      - requestId
      - occurredAt
      - actorUserId
      - reason
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        outputLotId:
          $ref: '#/components/schemas/Uuid'
        itemId:
          $ref: '#/components/schemas/Uuid'
        materialDemandId:
          type:
          - string
          - 'null'
        executionRunId:
          type:
          - string
          - 'null'
        productionReportId:
          type:
          - string
          - 'null'
        targetTaskId:
          type:
          - string
          - 'null'
        reversalOfId:
          type:
          - string
          - 'null'
        eventType:
          type: string
        fromBucket:
          type:
          - string
          - 'null'
        toBucket:
          type:
          - string
          - 'null'
        quantity:
          type: number
          minimum: 0
        uomCode:
          type: string
        requestId:
          $ref: '#/components/schemas/Uuid'
        occurredAt:
          $ref: '#/components/schemas/UtcInstant'
        actorUserId:
          type: string
        reason:
          type:
          - string
          - 'null'
    ExecutionRunStatus:
      enum: [READY, RUNNING, PAUSED, WAIT_QUALITY, COMPLETED, CANCELLED]
    CreateExecutionRunRequest:
      type: object
      additionalProperties: false
      required: [planVersionId, planJobId, assignedQty, uomCode]
      properties:
        planVersionId: { $ref: '#/components/schemas/Uuid' }
        planJobId: { $ref: '#/components/schemas/Uuid' }
        assignedQty: { type: number, exclusiveMinimum: 0 }
        uomCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,15}$' }
    ExecutionTransitionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedRowVersion, occurredAt]
      properties:
        action: { enum: [START, PAUSE, RESUME, CANCEL] }
        expectedRowVersion: { $ref: '#/components/schemas/RowVersion' }
        occurredAt: { $ref: '#/components/schemas/UtcInstant' }
        reason: { type: [string, 'null'], maxLength: 500 }
    ExecutionResourceChangeRequest:
      type: object
      additionalProperties: false
      required: [expectedRowVersion, replacedResourceId, resourceId, activityType, occurredAt]
      properties:
        expectedRowVersion: { $ref: '#/components/schemas/RowVersion' }
        planSegmentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        replacedResourceId: { $ref: '#/components/schemas/Uuid' }
        resourceId: { $ref: '#/components/schemas/Uuid' }
        activityType: { enum: [SETUP, RUN, UNLOAD, WAIT_HOLD, PAUSE_HOLD, TRANSPORT] }
        occurredAt: { $ref: '#/components/schemas/UtcInstant' }
        reason: { type: [string, 'null'], maxLength: 500 }
    ExecutionPhaseAdvanceRequest:
      type: object
      additionalProperties: false
      required: [expectedRowVersion, occurredAt]
      properties:
        expectedRowVersion: { $ref: '#/components/schemas/RowVersion' }
        occurredAt: { $ref: '#/components/schemas/UtcInstant' }
        reason: { type: [string, 'null'], maxLength: 500 }
    ProductionReportQuantities:
      type: object
      additionalProperties: false
      required: [processedQty, goodQty, pendingQty, rejectedQty, scrapQty, transferredQty]
      properties:
        processedQty: { type: number, minimum: 0 }
        goodQty: { type: number, minimum: 0 }
        pendingQty: { type: number, minimum: 0 }
        rejectedQty: { type: number, minimum: 0 }
        scrapQty: { type: number, minimum: 0 }
        transferredQty: { type: number, minimum: 0 }
      description: processedQty 必须等于 goodQty + pendingQty + rejectedQty；scrapQty 不超过 rejectedQty，transferredQty 不超过 goodQty。
    CreateProductionReportRequest:
      type: object
      additionalProperties: false
      required: [expectedRowVersion, planJobMemberId, taskId, reportType, reportedAt, quantities, uomCode]
      properties:
        expectedRowVersion: { $ref: '#/components/schemas/RowVersion' }
        planJobMemberId: { $ref: '#/components/schemas/Uuid' }
        taskId: { $ref: '#/components/schemas/Uuid' }
        reportType: { enum: [PROGRESS, COMPLETE] }
        reportedAt: { $ref: '#/components/schemas/UtcInstant' }
        quantities: { $ref: '#/components/schemas/ProductionReportQuantities' }
        uomCode: { type: string, pattern: '^[A-Z][A-Z0-9_]{0,15}$' }
        defectReason: { type: [string, 'null'], maxLength: 500 }
        operatorUserId: { type: [string, 'null'], maxLength: 64, deprecated: true, description: 兼容旧请求但忽略自由输入，使用当前认证用户写入 }
    CorrectProductionReportRequest:
      type: object
      additionalProperties: false
      required: [expectedRunRowVersion, expectedReportRowVersion, reportedAt, quantities]
      properties:
        expectedRunRowVersion: { $ref: '#/components/schemas/RowVersion' }
        expectedReportRowVersion: { $ref: '#/components/schemas/RowVersion' }
        reportedAt: { $ref: '#/components/schemas/UtcInstant' }
        quantities: { $ref: '#/components/schemas/ProductionReportQuantities' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    QualityDecisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRunRowVersion, expectedOutputLotRowVersion, decision, quantity, occurredAt]
      properties:
        expectedRunRowVersion: { $ref: '#/components/schemas/RowVersion' }
        expectedOutputLotRowVersion: { $ref: '#/components/schemas/RowVersion' }
        decision: { enum: [HOLD, RELEASE, REJECT, REWORK, SCRAP, USE_AS_IS] }
        quantity: { type: number, exclusiveMinimum: 0 }
        occurredAt: { $ref: '#/components/schemas/UtcInstant' }
        reason: { type: [string, 'null'], maxLength: 500 }
        createReplenishment: { type: boolean, default: false }
    QuantityMovementRequest:
      type: object
      additionalProperties: false
      required: [expectedRunRowVersion, expectedOutputLotRowVersion, materialDemandId, targetTaskId, operation, quantity, occurredAt]
      properties:
        expectedRunRowVersion: { $ref: '#/components/schemas/RowVersion' }
        expectedOutputLotRowVersion: { $ref: '#/components/schemas/RowVersion' }
        materialDemandId: { $ref: '#/components/schemas/Uuid' }
        targetTaskId: { $ref: '#/components/schemas/Uuid' }
        targetExecutionRunId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        operation: { enum: [RESERVE, UNRESERVE, CONSUME, TRANSFER] }
        quantity: { type: number, exclusiveMinimum: 0 }
        occurredAt: { $ref: '#/components/schemas/UtcInstant' }
        reason: { type: [string, 'null'], maxLength: 500 }
    ExecutionRunSummary:
      type: object
      additionalProperties: false
      required: [id, planVersionId, planJobId, runNo, status, assignedQty, uomCode, requestId, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        planVersionId: { $ref: '#/components/schemas/Uuid' }
        planJobId: { $ref: '#/components/schemas/Uuid' }
        runNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/ExecutionRunStatus' }
        assignedQty: { type: number, exclusiveMinimum: 0 }
        uomCode: { type: string }
        actualStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        actualEndAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        pauseReason: { type: [string, 'null'] }
        requestId: { type: string }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    ExecutionRunDetailResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, run, occupancies, reports, outputLots, executionRevision]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: EXECUTION_RUN_DETAIL }
        run: { $ref: '#/components/schemas/ExecutionRunSummary' }
        occupancies: { type: array, items: { $ref: '#/components/schemas/ActualOccupancy' } }
        reports: { type: array, items: { $ref: '#/components/schemas/ProductionReport' } }
        outputLots: { type: array, items: { $ref: '#/components/schemas/OutputLot' } }
        executionRevision: { type: integer, minimum: 0 }
    ActualOccupancy:
      type: object
      additionalProperties: false
      required: [id, planJobId, executionRunId, resourceId, activityType, startAt, status, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        planJobId: { $ref: '#/components/schemas/Uuid' }
        executionRunId: { $ref: '#/components/schemas/Uuid' }
        planSegmentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        sourcePlanAllocationId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        resourceId: { $ref: '#/components/schemas/Uuid' }
        activityType: { enum: [SETUP, RUN, UNLOAD, WAIT_HOLD, PAUSE_HOLD, TRANSPORT] }
        startAt: { $ref: '#/components/schemas/UtcInstant' }
        endAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        status: { enum: [ACTIVE, COMPLETED, CORRECTION, VOID] }
        correctionOfId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reason: { type: [string, 'null'] }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    ProductionReport:
      type: object
      additionalProperties: false
      required: [id, planJobId, executionRunId, planJobMemberId, taskId, reportType, reportedAt, quantities, uomCode, requestId, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        planJobId: { $ref: '#/components/schemas/Uuid' }
        executionRunId: { $ref: '#/components/schemas/Uuid' }
        planJobMemberId: { $ref: '#/components/schemas/Uuid' }
        taskId: { $ref: '#/components/schemas/Uuid' }
        reportType: { enum: [PROGRESS, COMPLETE, CORRECTION] }
        reportedAt: { $ref: '#/components/schemas/UtcInstant' }
        quantities: { $ref: '#/components/schemas/ProductionReportQuantities' }
        uomCode: { type: string }
        defectReason: { type: [string, 'null'] }
        correctionOfId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        requestId: { type: string }
        operatorUserId: { type: [string, 'null'] }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    OutputLot:
      type: object
      additionalProperties: false
      required: [id, productionLotId, sourceTaskId, sourceReportId, itemId, outputLotNo, qualityStatus, totalQty, availableQty, reservedQty, consumedQty, scrappedQty, uomCode, dispositionType, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        productionLotId: { $ref: '#/components/schemas/Uuid' }
        sourceTaskId: { $ref: '#/components/schemas/Uuid' }
        sourceReportId: { $ref: '#/components/schemas/Uuid' }
        itemId: { $ref: '#/components/schemas/Uuid' }
        sourceOutputLotId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        outputLotNo: { type: string }
        qualityStatus: { enum: [PENDING, RELEASED, HOLD, REJECTED, CLOSED] }
        totalQty: { type: number, exclusiveMinimum: 0 }
        availableQty: { type: number, minimum: 0 }
        reservedQty: { type: number, minimum: 0 }
        consumedQty: { type: number, minimum: 0 }
        scrappedQty: { type: number, minimum: 0 }
        uomCode: { type: string }
        dispositionType: { enum: [NONE, REWORK, SCRAP, USE_AS_IS] }
        dispositionReason: { type: [string, 'null'] }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    Uuid:
      type: string
      format: uuid
      pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    UtcInstant:
      type: string
      format: date-time
      description: UTC Z 时间；MySQL 持久化按 DATETIME(3) 截断为毫秒
      pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,9})?Z$'
    Sha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
    LifecycleStatus:
      enum: [ACTIVE, INACTIVE]
    RowVersion:
      type: integer
      minimum: 0
    ReportMetadata:
      type: object
      additionalProperties: false
      required: [siteCode, zoneId, dataCutoffAt, generatedAt]
      properties:
        siteCode: { type: string, minLength: 1, maxLength: 64 }
        zoneId: { type: string, minLength: 1, maxLength: 64 }
        fromAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        toAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        baselinePlanVersionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }

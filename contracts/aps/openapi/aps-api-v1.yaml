      required: [predecessorLineNo, predecessorNodeCode, successorNodeCode, dependencyType, lagSeconds, consumesOutput]
      properties:
        predecessorLineNo: { type: integer, minimum: 1 }
        predecessorNodeCode: { type: string, minLength: 1, maxLength: 64 }
        successorNodeCode: { type: string, minLength: 1, maxLength: 64 }
        dependencyType: { enum: [FINISH, QUANTITY, SAME_START] }
        thresholdQty: { type: [number, 'null'], exclusiveMinimum: 0 }
        thresholdRatio: { type: [number, 'null'], exclusiveMinimum: 0, maximum: 1 }
        transferBatchQty: { type: [number, 'null'], exclusiveMinimum: 0 }
        lagSeconds: { type: integer, minimum: 0 }
        consumesOutput: { type: boolean }
    OrderLineInput:
      type: object
      additionalProperties: false
      required: [lineNo, itemId, routeVersionId, demandQty, uomCode, components, dependencies]
      properties:
        lineNo: { type: integer, minimum: 1 }
        itemId: { $ref: '#/components/schemas/Uuid' }
        routeVersionId: { $ref: '#/components/schemas/Uuid' }
        demandQty: { type: number, exclusiveMinimum: 0 }
        uomCode: { type: string, minLength: 1, maxLength: 16 }
        promisedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        earliestStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        components: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ComponentInput' } }
        dependencies: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/LineDependencyInput' } }
    OrderInput:
      type: object
      additionalProperties: false
      required: [orderNo, priority, lines]
      properties:
        orderNo: { type: string, minLength: 1, maxLength: 64 }
        sourceSystem: { type: [string, 'null'], maxLength: 32 }
        externalId: { type: [string, 'null'], maxLength: 128 }
        customerCode: { type: [string, 'null'], maxLength: 64 }
        customerName: { type: [string, 'null'], maxLength: 128 }
        priority: { type: integer, minimum: 1, maximum: 100 }
        promisedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        earliestStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        remark: { type: [string, 'null'], maxLength: 500 }
        lines: { type: array, minItems: 1, maxItems: 1000, items: { $ref: '#/components/schemas/OrderLineInput' } }
    OrderLine:
      type: object
      required: [id, orderId, lineNo, itemId, routeVersionId, demandQty, uomCode, status, components, dependencies, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderId: { $ref: '#/components/schemas/Uuid' }
        lineNo: { type: integer, minimum: 1 }
        itemId: { $ref: '#/components/schemas/Uuid' }
        routeVersionId: { $ref: '#/components/schemas/Uuid' }
        demandQty: { type: number, exclusiveMinimum: 0 }
        uomCode: { type: string }
        promisedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        earliestStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        status: { enum: [DRAFT, RELEASED, IN_PRODUCTION, COMPLETED, CANCELLED] }
        components: { type: array, items: { $ref: '#/components/schemas/ComponentInput' } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/LineDependencyInput' } }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    ProductionOrder:
      type: object
      required: [id, orderNo, sourceSystem, priority, status, lines, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderNo: { type: string }
        sourceSystem: { type: string }
        externalId: { type: [string, 'null'] }
        customerCode: { type: [string, 'null'] }
        customerName: { type: [string, 'null'] }
        priority: { type: integer, minimum: 1, maximum: 100 }
        promisedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        earliestStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        status: { enum: [DRAFT, RELEASED, IN_PRODUCTION, COMPLETED, CANCELLED] }
        remark: { type: [string, 'null'] }
        lines: { type: array, minItems: 1, items: { $ref: '#/components/schemas/OrderLine' } }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    ProductionLot:
      type: object
      required: [id, orderLineId, itemId, routeVersionId, lotNo, lotType, plannedQty, uomCode, status, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        orderLineId: { $ref: '#/components/schemas/Uuid' }
        itemId: { $ref: '#/components/schemas/Uuid' }
        routeVersionId: { $ref: '#/components/schemas/Uuid' }
        parentLotId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lotNo: { type: string }
        lotType: { enum: [NORMAL, SPLIT, REWORK, REPLENISH] }
        plannedQty: { type: number, exclusiveMinimum: 0 }
        uomCode: { type: string }
        recoveryReason: { type: [string, 'null'] }
        status: { enum: [PLANNED, RELEASED, IN_PRODUCTION, COMPLETED, CANCELLED] }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    ExpansionResult:
      type: object
      required: [order, lots, tasks, dependencies, materialDemands, reused]
      properties:
        order: { $ref: '#/components/schemas/ProductionOrder' }
        lots: { type: array, items: { $ref: '#/components/schemas/ProductionLot' } }
        tasks: { type: array, items: { type: object } }
        dependencies: { type: array, items: { type: object } }
        materialDemands: { type: array, items: { type: object } }
        reused: { type: boolean }
    DerivedLotInput:
      type: object
      additionalProperties: false
      required: [parentLotId, lotType, plannedQty, recoveryReason]
      properties:
        parentLotId: { $ref: '#/components/schemas/Uuid' }
        lotType: { enum: [SPLIT, REWORK, REPLENISH] }
        plannedQty: { type: number, exclusiveMinimum: 0 }
        recoveryReason: { type: string, minLength: 1, maxLength: 500 }
    RouteMigrationInput:
      type: object
      additionalProperties: false
      required: [expectedCurrentRouteVersionId, targetRouteVersionId, rowVersion, confirmed]
      properties:
        expectedCurrentRouteVersionId: { $ref: '#/components/schemas/Uuid' }
        targetRouteVersionId: { $ref: '#/components/schemas/Uuid' }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
        confirmed: { const: true }
    RouteMigrationDiff:
      type: object
      required: [orderLineId, currentRouteVersionId, targetRouteVersionId, addedNodes, removedNodes, changedOperations, addedEdges, removedEdges, confirmationRequired]
      properties:
        orderLineId: { $ref: '#/components/schemas/Uuid' }
        currentRouteVersionId: { $ref: '#/components/schemas/Uuid' }
        targetRouteVersionId: { $ref: '#/components/schemas/Uuid' }
        addedNodes: { type: array, items: { type: string } }
        removedNodes: { type: array, items: { type: string } }
        changedOperations: { type: array, items: { type: string } }
        addedEdges: { type: array, items: { type: string } }
        removedEdges: { type: array, items: { type: string } }
        confirmationRequired: { const: true }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, service, status, checkedAt]
      properties:
        schemaVersion:
          const: '1.0'
        contractType:
          const: APS_HEALTH
        service:
          const: aps-api
        status:
          enum: [UP, DEGRADED, DOWN]
        checkedAt:
          $ref: '#/components/schemas/UtcInstant'
    CapabilityStatus:
      enum: [CONTRACT_ONLY, DISABLED, AVAILABLE]
    Capability:
      type: object
      additionalProperties: false
      required: [name, version, status]
      properties:
        name:
          enum: [RESOURCE_CALENDAR, ROUTING_ORDER, SCHEMA_METADATA, INPUT_VALIDATION, PLAN_REQUEST_STATUS, SOLVER, PUBLISH, EXTERNAL_DISPATCH]
        version:
          const: '1.0'
        status:
          $ref: '#/components/schemas/CapabilityStatus'
        reasonCode:
          type: [string, 'null']
          minLength: 1
          maxLength: 96
          pattern: '^[A-Z][A-Z0-9_]*$'
    ExecutionTopology:
      type: object
      additionalProperties: false
      required:
        - workerMode
        - leaseSupported
        - fencingSupported
        - inboxSupported
        - outboxSupported
        - externalDispatchSupported
      properties:
        workerMode:
          const: SINGLE_WORKER
        leaseSupported:
          const: false
        fencingSupported:
          const: false
        inboxSupported:
          const: false
        outboxSupported:
          const: false
        externalDispatchSupported:
          const: false
    CapabilitiesResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, service, apiVersion, implementationStage, topology, capabilities]
      properties:
        schemaVersion:
          const: '1.0'
        contractType:
          const: APS_CAPABILITIES
        service:
          const: aps-api
        apiVersion:
          const: '1.0'
        implementationStage:
          enum: [IMP_01, IMP_02, IMP_03, IMP_04, IMP_05, IMP_06, IMP_07, IMP_08, IMP_09, IMP_10]
        topology:
          $ref: '#/components/schemas/ExecutionTopology'
        capabilities:
          type: array
          minItems: 8
          maxItems: 8
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Capability'
          allOf:
            - contains:
                type: object
                properties:
                  name:
                    const: RESOURCE_CALENDAR
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: ROUTING_ORDER
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: SCHEMA_METADATA
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: INPUT_VALIDATION
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: PLAN_REQUEST_STATUS
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: SOLVER
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: PUBLISH
                required: [name]
              minContains: 1
              maxContains: 1
            - contains:
                type: object
                properties:
                  name:
                    const: EXTERNAL_DISPATCH
                required: [name]
              minContains: 1
              maxContains: 1
    SchemaMetadata:
      type: object
      additionalProperties: false
      required: [name, schemaVersion, mediaType, uri]
      properties:
        name:
          enum: [SolverInput, SolverResult, ValidationResult, Problem]
        schemaVersion:
          const: '1.0'
        mediaType:
          const: application/schema+json
        uri:
          type: string
          format: uri
          maxLength: 512
    SchemaMetadataResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, apiVersion, schemas]
      properties:
        schemaVersion:
          const: '1.0'
        contractType:
          const: APS_SCHEMA_METADATA
        apiVersion:
          const: '1.0'
        schemas:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: '#/components/schemas/SchemaMetadata'
    HorizonSummary:
      type: object
      description: 半开区间 [startAt,endAt)，detailEndAt 以内是必须详细排程范围
      additionalProperties: false
      required: [startAt, detailEndAt, endAt, planningAnchorAt, timeUnitSeconds]
      properties:
        startAt:
          $ref: '#/components/schemas/UtcInstant'
        detailEndAt:
          $ref: '#/components/schemas/UtcInstant'
        endAt:
          $ref: '#/components/schemas/UtcInstant'
        planningAnchorAt:
          $ref: '#/components/schemas/UtcInstant'
        timeUnitSeconds:
          enum: [1, 60]
    BaseVersionSummary:
      oneOf:
        - type: object
          additionalProperties: false
          required: [planVersionId, inputHash]
          properties:
            planVersionId:
              $ref: '#/components/schemas/Uuid'
            inputHash:
              $ref: '#/components/schemas/Sha256'
        - type: 'null'
    PlanVersionSummary:
      type: object
      additionalProperties: false
      required: [planVersionId, baseVersionId, versionNo, versionName, status, definitionRevision, executionRevision, inputHash, rowVersion, updatedAt]
      properties:
        planVersionId: { $ref: '#/components/schemas/Uuid' }
        baseVersionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        versionNo: { type: integer, minimum: 1 }
        versionName: { type: string, minLength: 1, maxLength: 128 }
        status: { enum: [DRAFT, SOLVING, FEASIBLE, CONFLICT, CANCELLED, PUBLISHING, PUBLISHED, FAILED, SUPERSEDED] }
        definitionRevision: { type: integer, minimum: 0 }
        executionRevision: { type: integer, minimum: 0 }
        inputHash: { $ref: '#/components/schemas/Sha256' }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
        updatedAt: { $ref: '#/components/schemas/UtcInstant' }
    PlanMember:
      type: object
      additionalProperties: false
      required: [id, taskId, memberNo, plannedQty, uomCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        taskId: { $ref: '#/components/schemas/Uuid' }
        memberNo: { type: integer, minimum: 1 }
        plannedQty: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
        uomCode: { type: string, minLength: 1, maxLength: 16 }
    PlanJob:
      type: object
      additionalProperties: false
      required: [jobId, operationSpecId, workCenterId, jobCode, jobType, batchCode, plannedQty, uomCode, capacityValue, capacityUomCode, compatibilityKey, carryRunId, startAt, endAt, members]
      allOf:
        - if:
            properties:
              jobType: { const: CARRY }
            required: [jobType]
          then:
            properties:
              carryRunId: { $ref: '#/components/schemas/Uuid' }
          else:
            properties:
              carryRunId: { type: 'null' }
      properties:
        jobId: { $ref: '#/components/schemas/Uuid' }
        operationSpecId: { $ref: '#/components/schemas/Uuid' }
        workCenterId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        jobCode: { type: string, minLength: 1, maxLength: 64 }
        jobType: { enum: [NORMAL, SPLIT, SHARED_BATCH, CARRY] }
        batchCode: { type: [string, 'null'], maxLength: 64 }
        plannedQty: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
        uomCode: { type: string, minLength: 1, maxLength: 16 }
        capacityValue:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        capacityUomCode: { type: [string, 'null'], maxLength: 16 }
        compatibilityKey: { type: [string, 'null'], maxLength: 128 }
        carryRunId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        startAt: { $ref: '#/components/schemas/UtcInstant' }
        endAt: { $ref: '#/components/schemas/UtcInstant' }
        members:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PlanMember' }
    PlanSegment:
      type: object
      additionalProperties: false
      required: [id, jobId, phaseId, segmentNo, phaseType, startAt, endAt, plannedQty, releaseAt, releaseQty, uomCode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        jobId: { $ref: '#/components/schemas/Uuid' }
        phaseId: { $ref: '#/components/schemas/Uuid' }
        segmentNo: { type: integer, minimum: 1 }
        phaseType: { enum: [SETUP, RUN, UNLOAD, WAIT, TRANSPORT] }
        startAt: { $ref: '#/components/schemas/UtcInstant' }
        endAt: { $ref: '#/components/schemas/UtcInstant' }
        plannedQty:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        releaseAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        releaseQty:
          type: [string, 'null']
          pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$'
        uomCode: { type: string, minLength: 1, maxLength: 16 }
    PlanAllocation:
      type: object
      additionalProperties: false
      required: [id, segmentId, phaseId, requirementId, resourceId, allocationRole, seatNo, capacityUsed]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        segmentId: { $ref: '#/components/schemas/Uuid' }
        phaseId: { $ref: '#/components/schemas/Uuid' }
        requirementId: { $ref: '#/components/schemas/Uuid' }
        resourceId: { $ref: '#/components/schemas/Uuid' }
        allocationRole: { enum: [PERSON, MACHINE, WORKSTATION, TOOL] }
        seatNo: { type: integer, minimum: 1 }
        capacityUsed: { type: string, pattern: '^(?:0|[1-9][0-9]*)(?:\.[0-9]+)?$' }
    PlanLock:
      type: object
      additionalProperties: false
      required: [id, targetType, jobId, segmentId, allocationId, lockType, lockedStartAt, lockedEndAt, lockedResourceId, reason, rowVersion]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        targetType: { enum: [JOB, SEGMENT, ALLOCATION] }
        jobId: { $ref: '#/components/schemas/Uuid' }
        segmentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        allocationId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        lockType: { enum: [TIME, RESOURCE, FULL] }
        lockedStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        lockedEndAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        lockedResourceId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        rowVersion: { $ref: '#/components/schemas/RowVersion' }
    CreatePlanLockRequest:
      type: object
      additionalProperties: false
      required: [expectedPlanRowVersion, targetType, targetId, lockType, reason]
      properties:
        expectedPlanRowVersion: { $ref: '#/components/schemas/RowVersion' }
        targetType: { enum: [JOB, SEGMENT, ALLOCATION] }
        targetId: { $ref: '#/components/schemas/Uuid' }
        lockType: { enum: [TIME, RESOURCE, FULL] }
        requestedResourceId:
          description: TIME 必须省略；ALLOCATION 由服务端推导；JOB/SEGMENT 的 RESOURCE 或 FULL 必须是目标当前已分配资源。
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreatePlanAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [expectedBaseRowVersion, capturedAt, targetType, targetId, requestedStartAt, requestedEndAt, reason]
      properties:
        expectedBaseRowVersion: { $ref: '#/components/schemas/RowVersion' }
        capturedAt: { $ref: '#/components/schemas/UtcInstant' }
        targetType: { enum: [JOB, SEGMENT, ALLOCATION] }
        targetId: { $ref: '#/components/schemas/Uuid' }
        requestedStartAt: { $ref: '#/components/schemas/UtcInstant' }
        requestedEndAt: { $ref: '#/components/schemas/UtcInstant' }
        requestedResourceId:
          description: 仅具体 ALLOCATION 可换人或换设备；必须是冻结需求中的合格候选资源。
          oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }]
        reason: { type: string, minLength: 1, maxLength: 500 }
    CreatePlanStructuralAdjustmentRequest:
      oneOf:
        - $ref: '#/components/schemas/InsertOrderStructuralAdjustmentRequest'
        - $ref: '#/components/schemas/SplitLotStructuralAdjustmentRequest'
        - $ref: '#/components/schemas/MergeBatchStructuralAdjustmentRequest'
    InsertOrderStructuralAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [expectedBaseRowVersion, capturedAt, action, orderId, reason]
      properties:
        expectedBaseRowVersion: { $ref: '#/components/schemas/RowVersion' }
        capturedAt: { $ref: '#/components/schemas/UtcInstant' }
        action: { const: INSERT_ORDER }
        orderId: { $ref: '#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    SplitLotStructuralAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [expectedBaseRowVersion, capturedAt, action, parentLotId, splitQuantity, reason]
      properties:
        expectedBaseRowVersion: { $ref: '#/components/schemas/RowVersion' }
        capturedAt: { $ref: '#/components/schemas/UtcInstant' }
        action: { const: SPLIT_LOT }
        parentLotId: { $ref: '#/components/schemas/Uuid' }
        splitQuantity: { type: number, exclusiveMinimum: 0 }
        reason: { type: string, minLength: 1, maxLength: 500 }
    MergeBatchStructuralAdjustmentRequest:
      type: object
      additionalProperties: false
      required: [expectedBaseRowVersion, capturedAt, action, compatibilityKey, members, reason]
      properties:
        expectedBaseRowVersion: { $ref: '#/components/schemas/RowVersion' }
        capturedAt: { $ref: '#/components/schemas/UtcInstant' }
        action: { const: MERGE_BATCH }
        compatibilityKey: { type: string, minLength: 1, maxLength: 128 }
        members:
          type: array
          minItems: 2
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/PlanRequestSharedBatchMemberInput' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PlanAdjustmentImpact:
      type: object
      additionalProperties: false
      required: [affectedTaskIds, affectedResourceIds, reasons, globalRevalidationRequired]
      properties:
        affectedTaskIds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        affectedResourceIds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        reasons:
          type: object
          additionalProperties:
            type: array
            uniqueItems: true
            items: { type: string, minLength: 1, maxLength: 256 }
        globalRevalidationRequired: { const: true }
    PlanAdjustmentAcceptedResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, requestId, planVersionId, basePlanVersionId, planStatus, reused, baseCandidateHash, impact]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: PLAN_ADJUSTMENT_ACCEPTED }
        requestId: { $ref: '#/components/schemas/Uuid' }
        planVersionId: { $ref: '#/components/schemas/Uuid' }
        basePlanVersionId: { $ref: '#/components/schemas/Uuid' }
        planStatus: { enum: [DRAFT, SOLVING, FEASIBLE, CONFLICT, CANCELLED, PUBLISHING, PUBLISHED, FAILED, SUPERSEDED] }
        reused: { type: boolean }
        baseCandidateHash: { $ref: '#/components/schemas/Sha256' }
        impact: { $ref: '#/components/schemas/PlanAdjustmentImpact' }
    PlanStructuralAdjustmentAcceptedResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, requestId, planVersionId, basePlanVersionId, planStatus, reused, action, derivedLotId, baseCandidateHash, impact]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: PLAN_STRUCTURAL_ADJUSTMENT_ACCEPTED }
        requestId: { $ref: '#/components/schemas/Uuid' }
        planVersionId: { $ref: '#/components/schemas/Uuid' }
        basePlanVersionId: { $ref: '#/components/schemas/Uuid' }
        planStatus: { enum: [DRAFT, SOLVING, FEASIBLE, CONFLICT, CANCELLED, PUBLISHING, PUBLISHED, FAILED, SUPERSEDED] }
        reused: { type: boolean }
        action: { enum: [INSERT_ORDER, SPLIT_LOT, MERGE_BATCH] }
        derivedLotId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        baseCandidateHash: { $ref: '#/components/schemas/Sha256' }
        impact: { $ref: '#/components/schemas/PlanAdjustmentImpact' }
    PublishPlanRequest:
      type: object
      additionalProperties: false
      required: [expectedPlanRowVersion, reason]
      properties:
        expectedPlanRowVersion: { $ref: '#/components/schemas/RowVersion' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PlanPublishedResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, plan, reused, supersededVersionId, reason, outboundStatus]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: PLAN_PUBLISHED }
        plan: { $ref: '#/components/schemas/PlanVersionDetailResponse' }
        reused: { type: boolean }
        supersededVersionId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        reason: { type: string, minLength: 1, maxLength: 500 }
        outboundStatus: { const: NOT_APPLICABLE }
    DiscardCandidateRequest:
      type: object
      additionalProperties: false
      required: [expectedPlanRowVersion, reason]
      properties:
        expectedPlanRowVersion: { $ref: '#/components/schemas/RowVersion' }
        reason: { type: string, minLength: 1, maxLength: 500 }
    PlanCandidateDiscardedResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, plan, reason, discardedAt]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: PLAN_CANDIDATE_DISCARDED }
        plan: { $ref: '#/components/schemas/PlanVersionDetailResponse' }
        reason: { type: string, minLength: 1, maxLength: 500 }
        discardedAt: { $ref: '#/components/schemas/UtcInstant' }
    PlanVersionDetailResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, version, candidateHash, solverStatus, resultKind, unplannedTaskIds, inputCapturedAt, latestFactUpdatedAt, stale, jobs, segments, allocations, locks, problems]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: PLAN_VERSION_DETAIL }
        version: { $ref: '#/components/schemas/PlanVersionSummary' }
        candidateHash: { oneOf: [{ $ref: '#/components/schemas/Sha256' }, { type: 'null' }] }
        solverStatus:
          oneOf:
            - enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID]
            - type: 'null'
        resultKind:
          oneOf:
            - enum: [FEASIBLE, TIMEOUT_WITH_SOLUTION, INFEASIBLE_PROVEN, TIMEOUT_NO_SOLUTION, INVALID_INPUT]
            - type: 'null'
        unplannedTaskIds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        inputCapturedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        latestFactUpdatedAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        stale: { type: boolean }
        jobs: { type: array, items: { $ref: '#/components/schemas/PlanJob' } }
        segments: { type: array, items: { $ref: '#/components/schemas/PlanSegment' } }
        allocations: { type: array, items: { $ref: '#/components/schemas/PlanAllocation' } }
        locks: { type: array, items: { $ref: '#/components/schemas/PlanLock' } }
        problems: { type: array, items: { $ref: '../schemas/problem-v1.schema.json' } }
    PlanVersionChangeSummary:
      type: object
      additionalProperties: false
      required: [added, removed, changed, unchanged]
      properties:
        added: { type: integer, minimum: 0 }
        removed: { type: integer, minimum: 0 }
        changed: { type: integer, minimum: 0 }
        unchanged: { type: integer, minimum: 0 }
    PlanJobChange:
      type: object
      additionalProperties: false
      required: [changeType, memberTaskIds, dimensions, baseJobId, targetJobId, baseStartAt, baseEndAt, targetStartAt, targetEndAt, baseResourceIds, targetResourceIds]
      properties:
        changeType: { enum: [ADDED, REMOVED, CHANGED, UNCHANGED] }
        memberTaskIds: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        dimensions:
          type: array
          uniqueItems: true
          items: { enum: [TIME, RESOURCE, JOB_TYPE, QUANTITY, WORK_CENTER] }
        baseJobId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        targetJobId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
        baseStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        baseEndAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        targetStartAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        targetEndAt: { oneOf: [{ $ref: '#/components/schemas/UtcInstant' }, { type: 'null' }] }
        baseResourceIds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
        targetResourceIds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
    PlanVersionComparisonResponse:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, baseVersionId, targetVersionId, summary, jobs]
      properties:
        schemaVersion: { const: '1.0' }
        contractType: { const: PLAN_VERSION_COMPARISON }
        baseVersionId: { $ref: '#/components/schemas/Uuid' }
        targetVersionId: { $ref: '#/components/schemas/Uuid' }
        summary: { $ref: '#/components/schemas/PlanVersionChangeSummary' }
        jobs: { type: array, items: { $ref: '#/components/schemas/PlanJobChange' } }
    PlanRequestInput:
      type: object
      additionalProperties: false
      required: [siteCode, workshopIds, orderIds, capturedAt, definitionRevision, executionRevision, horizon, parameters]
      properties:
        siteCode:
          type: string
          minLength: 1
          maxLength: 64
        workshopIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        orderIds:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        capturedAt:
          $ref: '#/components/schemas/UtcInstant'
        definitionRevision:
          type: integer
          minimum: 0
        executionRevision:
          type: integer
          minimum: 0
        horizon:
          $ref: '#/components/schemas/PlanRequestHorizonInput'
        parameters:
          $ref: '#/components/schemas/PlanRequestParametersInput'
        sharedBatches:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/PlanRequestSharedBatchInput'
        baseVersion:
          $ref: '#/components/schemas/PlanRequestBaseVersionInput'
    PlanRequestBaseVersionInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [planVersionId, inputHash, freezeEndAt]
          properties:
            planVersionId:
              $ref: '#/components/schemas/Uuid'
            inputHash:
              $ref: '#/components/schemas/Sha256'
            freezeEndAt:
              $ref: '#/components/schemas/UtcInstant'
        - type: 'null'
    PlanRequestSharedBatchInput:
      type: object
      additionalProperties: false
      required: [compatibilityKey, members]
      properties:
        compatibilityKey:
          type: string
          minLength: 1
          maxLength: 128
        members:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: '#/components/schemas/PlanRequestSharedBatchMemberInput'
    PlanRequestSharedBatchMemberInput:
      type: object
      additionalProperties: false
      required: [taskId, quantity]
      properties:
        taskId:
          $ref: '#/components/schemas/Uuid'
        quantity:
          type: number
          exclusiveMinimum: 0
    PlanRequestHorizonInput:
      type: object
      additionalProperties: false
      required: [startAt, detailEndAt, endAt, planningAnchorAt, timeUnitSeconds, displayTimeZone]
      properties:
        startAt: { $ref: '#/components/schemas/UtcInstant' }
        detailEndAt: { $ref: '#/components/schemas/UtcInstant' }
        endAt: { $ref: '#/components/schemas/UtcInstant' }
        planningAnchorAt: { $ref: '#/components/schemas/UtcInstant' }
        timeUnitSeconds:
          enum: [1, 60]
        displayTimeZone:
          type: string
          minLength: 1
          maxLength: 64
    PlanRequestParametersInput:
      type: object
      additionalProperties: false
      required: [maxSolveSeconds, randomSeed, solverSearchThreads, absoluteGapLimit, relativeGapLimit]
      properties:
        maxSolveSeconds:
          type: integer
          minimum: 1
          maximum: 3600
        randomSeed:
          type: integer
        solverSearchThreads:
          type: integer
          minimum: 1
          maximum: 32
        absoluteGapLimit:
          type: number
          minimum: 0
          maximum: 1000000000
        relativeGapLimit:
          type: number
          minimum: 0
          maximum: 1
    PlanRequestStatusResponse:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - contractType
        - requestId
        - planVersionId
        - definitionRevision
        - executionRevision
        - inputHash
        - horizon
        - baseVersion
        - planStatus
        - solverStatus
        - resultKind
        - reasonCodes
        - updatedAt
      properties:
        schemaVersion:
          const: '1.0'
        contractType:
          const: PLAN_REQUEST_STATUS
        requestId:
          $ref: '#/components/schemas/Uuid'
        planVersionId:
          $ref: '#/components/schemas/Uuid'
        definitionRevision:
          type: integer
          minimum: 0
        executionRevision:
          type: integer
          minimum: 0
        inputHash:
          $ref: '#/components/schemas/Sha256'
        horizon:
          $ref: '#/components/schemas/HorizonSummary'
        baseVersion:
          $ref: '#/components/schemas/BaseVersionSummary'
        planStatus:
          enum: [DRAFT, SOLVING, FEASIBLE, CONFLICT, CANCELLED, PUBLISHING, PUBLISHED, FAILED, SUPERSEDED]
        solverStatus:
          type: [string, 'null']
          enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID, null]
        resultKind:
          type: [string, 'null']
          enum: [FEASIBLE, TIMEOUT_WITH_SOLUTION, INFEASIBLE_PROVEN, TIMEOUT_NO_SOLUTION, INVALID_INPUT, null]
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^[A-Z][A-Z0-9_]*$'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
      oneOf:
        - title: Draft request
          properties:
            planStatus:
              const: DRAFT
            solverStatus:
              type: 'null'
            resultKind:
              type: 'null'
        - title: Solving request
          properties:
            planStatus:
              const: SOLVING
            solverStatus:
              type: 'null'
            resultKind:
              type: 'null'
        - title: Candidate-bearing request
          properties:
            planStatus:
              enum: [FEASIBLE, PUBLISHING, PUBLISHED, SUPERSEDED]
          oneOf:
            - properties:
                solverStatus:
                  enum: [OPTIMAL, FEASIBLE]
                resultKind:
                  const: FEASIBLE
            - properties:
                solverStatus:
                  const: FEASIBLE
                resultKind:
                  const: TIMEOUT_WITH_SOLUTION
        - title: Conflict request
          properties:
            planStatus:
              const: CONFLICT
          oneOf:
            - properties:
                solverStatus:
                  const: INFEASIBLE
                resultKind:
                  const: INFEASIBLE_PROVEN
            - properties:
                solverStatus:
                  const: UNKNOWN
                resultKind:
                  const: TIMEOUT_NO_SOLUTION
            - properties:
                solverStatus:
                  type: 'null'
                resultKind:
                  const: INVALID_INPUT
        - title: Cancelled request
          properties:
            planStatus:
              const: CANCELLED
            solverStatus:
              enum: [UNKNOWN, null]
            resultKind:
              type: 'null'
        - title: Failed request
          properties:
            planStatus:
              const: FAILED
            solverStatus:
              enum: [MODEL_INVALID, UNKNOWN, null]
            resultKind:
              type: 'null'
    PlanRequestProgressEvent:
      type: object
      additionalProperties: false
      required: [schemaVersion, contractType, requestId, planVersionId, planStatus, solverStatus, resultKind, reasonCodes, updatedAt]
      properties:
        schemaVersion:
          const: '1.0'
        contractType:
          const: PLAN_REQUEST_PROGRESS
        requestId:
          $ref: '#/components/schemas/Uuid'
        planVersionId:
          $ref: '#/components/schemas/Uuid'
        planStatus:
          enum: [DRAFT, SOLVING, FEASIBLE, CONFLICT, CANCELLED, PUBLISHING, PUBLISHED, FAILED, SUPERSEDED]
        solverStatus:
          type: [string, 'null']
          enum: [OPTIMAL, FEASIBLE, INFEASIBLE, UNKNOWN, MODEL_INVALID, null]
        resultKind:
          type: [string, 'null']
          enum: [FEASIBLE, TIMEOUT_WITH_SOLUTION, INFEASIBLE_PROVEN, TIMEOUT_NO_SOLUTION, INVALID_INPUT, null]
        reasonCodes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 96
            pattern: '^[A-Z][A-Z0-9_]*$'
        updatedAt:
          $ref: '#/components/schemas/UtcInstant'
security:
  - bearerAuth: []

openapi: 3.1.0
info:
  title: APS Implementation Baseline API
  version: 1.0.0-draft
  summary: FEAT-APS-001 APS v1 机器契约
  description: |
    本文件冻结健康、能力、资源/绝对日历、产品工艺/订单展开、确定性校验、计划请求，以及计划版本详情/比较边界。
    IMP-07 已实现基础 CP-SAT、单 Worker、数量/共享批与 M19～M24 候选链路；IMP-08 已接入人工计划详情/比较、候选锁、版本化调整和系统内原子发布；IMP-09 冻结 M25～M29 执行、报工与质量命令边界；IMP-10 增加日冻结基线、累计人力产能与订单交期报表，外部下达不在 P0。
    当前运行拓扑限定为单 Worker；不提供租约、fencing、Inbox、Outbox 或外部 ACK 契约。
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
tags:
  - name: system
    description: 健康、能力和机器契约元数据
  - name: validation
    description: 输入或候选的独立确定性校验
  - name: plan-request
    description: 计划请求创建、状态恢复、取消与 SSE；人工计划锁、版本化调整和系统内发布由工作台管理
  - name: plan-workbench
    description: 计划版本详情、基线差异、候选锁、版本化调整和系统内原子发布
  - name: resource
    description: M01～M05 车间、工作中心、资源、技能与绝对日历
  - name: routing
    description: M06～M12 产品、工序、阶段资源要求和版本化路线 DAG
  - name: order
    description: M13～M18 多产品订单、生产批、任务网络和物料需求
  - name: execution
    description: M25～M29 执行 run、实际占用、报工、质量处置和不可变数量事件
  - name: report
    description: 基于同一事实源的每日生产、人力累计产能与订单交期报表
paths:
  /api/aps/v1/health:
    get:
      tags: [system]
      operationId: getApsHealthV1
      summary: 查询 APS API 基础健康状态
      security: []
      responses:
        '200':
          description: 进程可以响应；不表示 Worker、数据库或求解能力已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 进程不可提供服务
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
  /api/aps/v1/capabilities:
    get:
      tags: [system]
      operationId: getApsCapabilitiesV1
      summary: 查询当前实际启用的 APS 能力
      description: 需要 `aps:readiness:view`；调用方必须读取每项 `status`，不得仅因路径存在而推断功能可用。
      responses:
        '200':
          description: 能力清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CapabilitiesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/aps/v1/resources/workshops:
    get:
      tags: [resource]
      operationId: listApsWorkshopsV1
      summary: 查询当前用户数据范围内的车间
      responses:
        '200': { description: 车间列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Workshop' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resource]
      operationId: createApsWorkshopV1
      summary: 新增车间
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkshopInput' } } } }
      responses:
        '200': { description: 已保存车间, content: { application/json: { schema: { $ref: '#/components/schemas/Workshop' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/workshops/{id}:
    put:
      tags: [resource]
      operationId: updateApsWorkshopV1
      summary: 按乐观版本修改或启停车间
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkshopInput' } } } }
      responses:
        '200': { description: 已保存车间, content: { application/json: { schema: { $ref: '#/components/schemas/Workshop' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/resources/workshops/{workshopId}/centers:
    get:
      tags: [resource]
      operationId: listApsWorkCentersV1
      summary: 查询车间工作中心
      parameters: [{ $ref: '#/components/parameters/WorkshopId' }]
      responses:
        '200': { description: 工作中心列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/WorkCenter' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/centers:
    post:
      tags: [resource]
      operationId: createApsWorkCenterV1
      summary: 新增工作中心
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkCenterInput' } } } }
      responses:
        '200': { description: 已保存工作中心, content: { application/json: { schema: { $ref: '#/components/schemas/WorkCenter' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/centers/{id}:
    put:
      tags: [resource]
      operationId: updateApsWorkCenterV1
      summary: 按乐观版本修改或启停工作中心
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkCenterInput' } } } }
      responses:
        '200': { description: 已保存工作中心, content: { application/json: { schema: { $ref: '#/components/schemas/WorkCenter' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/resources:
    get:
      tags: [resource]
      operationId: listApsResourcesV1
      summary: 查询当前车间范围内的具名资源
      parameters:
        - { name: workshopId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: workCenterId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: 已按资源 ID 去重的资源列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Resource' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resource]
      operationId: createApsResourceV1
      summary: 新增人员、设备、工位或工具资源
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses:
        '200': { description: 已保存资源, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/{id}:
    put:
      tags: [resource]
      operationId: updateApsResourceV1
      summary: 按乐观版本修改或启停资源
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceInput' } } } }
      responses:
        '200': { description: 已保存资源, content: { application/json: { schema: { $ref: '#/components/schemas/Resource' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/resources/{resourceId}/skills:
    get:
      tags: [resource]
      operationId: listApsResourceSkillsV1
      summary: 查询资源的多项技能
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 技能行列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResourceSkill' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resource]
      operationId: saveApsResourceSkillV1
      summary: 新增或按乐观版本修改技能
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceSkillInput' } } } }
      responses:
        '200': { description: 已保存技能, content: { application/json: { schema: { $ref: '#/components/schemas/ResourceSkill' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/resources/{resourceId}/availability:
    get:
      tags: [resource]
      operationId: listApsResourceAvailabilityV1
      summary: 查询资源绝对时间窗
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      responses:
        '200': { description: 原始时间窗列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Availability' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [resource]
      operationId: saveApsResourceAvailabilityV1
      summary: 新增或按乐观版本修改绝对时间窗
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AvailabilityInput' } } } }
      responses:
        '200': { description: 已保存时间窗, content: { application/json: { schema: { $ref: '#/components/schemas/Availability' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/resources/{resourceId}/net-availability:
    get:
      tags: [resource]
      operationId: getApsNetAvailabilityV1
      summary: 编译指定范围的确定性净可用半开区间
      parameters:
        - { $ref: '#/components/parameters/ResourceId' }
        - { name: from, in: query, required: true, schema: { $ref: '#/components/schemas/UtcInstant' } }
        - { name: to, in: query, required: true, schema: { $ref: '#/components/schemas/UtcInstant' } }
      responses:
        '200': { description: 不含请假、维修和不可用覆盖段的净窗口, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/NetWindow' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/{resourceId}/availability-import:
    post:
      tags: [resource]
      operationId: importApsResourceAvailabilityV1
      summary: 原子批量导入资源绝对时间窗
      description: 要求 `aps:resource:import`；任一行无效时整批回滚，单批最多 10000 行。
      parameters: [{ $ref: '#/components/parameters/ResourceId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 10000
              items: { $ref: '#/components/schemas/AvailabilityInput' }
      responses:
        '200': { description: 已保存的时间窗, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Availability' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/resources/workshops/{workshopId}/readiness:
    get:
      tags: [resource]
      operationId: getApsResourceReadinessV1
      summary: 查询资源主数据就绪问题
      parameters:
        - { $ref: '#/components/parameters/WorkshopId' }
        - { name: at, in: query, required: true, schema: { $ref: '#/components/schemas/UtcInstant' } }
      responses:
        '200': { description: 问题列表；空列表仅表示 IMP-03 资源数据就绪, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ReadinessIssue' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/workshops/{workshopId}/candidates:
    get:
      tags: [resource]
      operationId: listApsResourceCandidatesV1
      summary: 按技能等级和净日历筛选候选资源
      parameters:
        - { $ref: '#/components/parameters/WorkshopId' }
        - { name: skillCode, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: minimumLevel, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 10 } }
        - { name: start, in: query, required: true, schema: { $ref: '#/components/schemas/UtcInstant' } }
        - { name: end, in: query, required: true, schema: { $ref: '#/components/schemas/UtcInstant' } }
      responses:
        '200': { description: 满足技能、状态和净日历的去重候选资源, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Candidate' } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/resources/personnel-export:
    get:
      tags: [resource]
      operationId: exportApsPersonnelV1
      summary: 导出人员明细
      description: 同时要求 `aps:resource:list` 与 `aps:scope:manage`，防止普通车间用户导出超范围人员信息。
      parameters:
        - { name: workshopId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: UTF-8 CSV, content: { text/csv: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/routings/items:
    get:
      tags: [routing]
      operationId: listApsItemsV1
      responses:
        '200': { description: 产品、半成品和基础物料, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Item' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [routing]
      operationId: createApsItemV1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemInput' } } } }
      responses:
        '200': { description: 已保存主数据, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/routings/items/{id}:
    put:
      tags: [routing]
      operationId: updateApsItemV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemInput' } } } }
      responses:
        '200': { description: 已按乐观版本保存, content: { application/json: { schema: { $ref: '#/components/schemas/Item' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/routings/operations:
    get:
      tags: [routing]
      operationId: listApsOperationsV1
      responses:
        '200': { description: 工序及阶段资源要求, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OperationSpec' } } } } }
    post:
      tags: [routing]
      operationId: createApsOperationV1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationInput' } } } }
      responses:
        '200': { description: 已保存工序草稿, content: { application/json: { schema: { $ref: '#/components/schemas/OperationSpec' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/aps/v1/routings/operations/{id}:
    put:
      tags: [routing]
      operationId: updateApsOperationV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OperationInput' } } } }
      responses:
        '200': { description: 已保存工序草稿, content: { application/json: { schema: { $ref: '#/components/schemas/OperationSpec' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/routings/operations/{id}/activate:
    post:
      tags: [routing]
      operationId: activateApsOperationV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionInput' } } } }
      responses:
        '200': { description: 已生效且不可原位修改的工序, content: { application/json: { schema: { $ref: '#/components/schemas/OperationSpec' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/routings/routes:
    get:
      tags: [routing]
      operationId: listApsRouteVersionsV1
      parameters: [{ name: itemId, in: query, required: false, schema: { $ref: '#/components/schemas/Uuid' } }]
      responses:
        '200': { description: 路线版本列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RouteVersion' } } } } }
    post:
      tags: [routing]
      operationId: createApsRouteVersionV1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RouteInput' } } } }
      responses:
        '200': { description: 已建立路线草稿, content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } } }
  /api/aps/v1/routings/routes/{id}:
    get:
      tags: [routing]
      operationId: getApsRouteGraphV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      responses:
        '200': { description: 路线版本及 DAG, content: { application/json: { schema: { $ref: '#/components/schemas/RouteGraph' } } } }
  /api/aps/v1/routings/routes/{id}/graph:
    put:
      tags: [routing]
      operationId: replaceApsRouteGraphV1
      description: 仅草稿可编辑；循环、自依赖、悬空边和重复结构原子拒绝。
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RouteGraphInput' } } } }
      responses:
        '200': { description: 已保存路线图, content: { application/json: { schema: { $ref: '#/components/schemas/RouteGraph' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/routings/routes/{id}/copy:
    post:
      tags: [routing]
      operationId: copyApsRouteVersionV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RouteCopyInput' } } } }
      responses:
        '200': { description: 独立的新路线草稿及复制图, content: { application/json: { schema: { $ref: '#/components/schemas/RouteGraph' } } } }
  /api/aps/v1/routings/routes/{id}/validation:
    get:
      tags: [routing]
      operationId: validateApsRouteVersionV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      responses:
        '200': { description: 对象级发布问题；含 SAME_START 时 publishable=false, content: { application/json: { schema: { $ref: '#/components/schemas/RouteValidation' } } } }
  /api/aps/v1/routings/routes/{id}/publish:
    post:
      tags: [routing]
      operationId: publishApsRouteVersionV1
      description: SAME_START 返回 409/UNSUPPORTED_SYNC_RULE 且保留草稿来源关系。
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionInput' } } } }
      responses:
        '200': { description: 已发布路线, content: { application/json: { schema: { $ref: '#/components/schemas/RouteVersion' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/orders:
    get:
      tags: [order]
      operationId: listApsOrdersV1
      responses:
        '200': { description: 多产品订单列表, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ProductionOrder' } } } } }
    post:
      tags: [order]
      operationId: createApsOrderV1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } } }
      responses:
        '200': { description: 已保存并冻结每行路线版本, content: { application/json: { schema: { $ref: '#/components/schemas/ProductionOrder' } } } }
  /api/aps/v1/orders/import:
    post:
      tags: [order]
      operationId: importApsOrderV1
      description: sourceSystem+externalId 是幂等键；相同键不同载荷返回 IDEMPOTENCY_CONFLICT。
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } } }
      responses:
        '200': { description: 新订单或相同载荷的原订单, content: { application/json: { schema: { $ref: '#/components/schemas/ProductionOrder' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/orders/{id}:
    put:
      tags:
      - order
      operationId: updateApsDraftOrderV1
      summary: 更新未展开订单草稿
      description: 需要 aps:order:edit。订单头与产品行在一个事务中更新。校验完整车间范围、状态、父行锁和rowVersion，保留订单号、来源和幂等键；已展开拒绝。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductionOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Uuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApsDraftOrderInput'
    get:
      tags: [order]
      operationId: getApsOrderV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      responses:
        '200': { description: 订单及所有独立产品行, content: { application/json: { schema: { $ref: '#/components/schemas/ProductionOrder' } } } }
  /api/aps/v1/orders/{id}/expand:
    post:
      tags: [order]
      operationId: expandApsOrderV1
      description: 稳定 ID 幂等展开 M15～M18；不会按产品行顺序制造依赖。
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      responses:
        '200': { description: 首次或复用的冻结任务网络, content: { application/json: { schema: { $ref: '#/components/schemas/ExpansionResult' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/aps/v1/orders/{id}/expansion:
    get:
      tags: [order]
      operationId: getApsOrderExpansionV1
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      responses:
        '200': { description: 当前冻结任务网络, content: { application/json: { schema: { $ref: '#/components/schemas/ExpansionResult' } } } }
  /api/aps/v1/orders/{id}/release:
    post:
      tags: [order]
      operationId: releaseApsOrderV1
      description: 结构释放；未发布路线或 SAME_START 均阻断，完整数据就绪属于 IMP-05。
      parameters: [{ $ref: '#/components/parameters/ResourceObjectId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/VersionInput' } } } }
      responses:
        '200': { description: 已释放订单, content: { application/json: { schema: { $ref: '#/components/schemas/ProductionOrder' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/orders/lots:
    post:
      tags: [order]
      operationId: createApsDerivedLotV1
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DerivedLotInput' } } } }
      responses:
        '200': { description: 已建立并展开的拆批、返工或补产批, content: { application/json: { schema: { $ref: '#/components/schemas/ProductionLot' } } } }
  /api/aps/v1/orders/lines/{lineId}/route-migration:
    get:
      tags: [order]
      operationId: previewApsOrderLineRouteMigrationV1
      parameters:
        - { name: lineId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: targetRouteVersionId, in: query, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: 节点、工序和边的差异；不自动迁移, content: { application/json: { schema: { $ref: '#/components/schemas/RouteMigrationDiff' } } } }
    post:
      tags: [order]
      operationId: confirmApsOrderLineRouteMigrationV1
      parameters: [{ name: lineId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RouteMigrationInput' } } } }
      responses:
        '200': { description: 仅未展开订单行完成显式确认迁移, content: { application/json: { schema: { $ref: '#/components/schemas/OrderLine' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/schemas:
    get:
      tags: [system]
      operationId: listApsSchemasV1
      summary: 查询当前机器契约元数据
      responses:
        '200':
          description: Schema 元数据；URI 指向版本化静态契约，不返回实现状态证明
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/aps/v1/validations:
    post:
      tags: [validation]
      operationId: validateSolverInputV1
      summary: 确定性校验一个 SolverInput v1
      description: |
        该接口已实现 IMP-05 的无副作用输入校验边界。Schema 合法并不保证业务校验通过。
        输入含 `SAME_START` 时必须返回 HTTP 200 的 ValidationResult，且结果为
        `validationStatus=FAIL`、`publishable=false`、`UNSUPPORTED_SYNC_RULE`；不得启动求解。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/solver-input-v1.schema.json'
      responses:
        '200':
          description: 确定性业务校验已完成；结果可能 PASS 或 FAIL
          content:
            application/json:
              schema:
                $ref: '../schemas/validation-result-v1.schema.json'
        '400':
          description: JSON 或基础 HTTP 请求无效
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 相同幂等键对应不同请求摘要
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
        '422':
          description: 请求不符合 SolverInput v1 的结构契约
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
  /api/aps/v1/plan-requests:
    post:
      tags: [plan-request]
      operationId: createPlanRequestV1
      summary: 创建幂等的基础有限产能排程请求
      description: |
        `Idempotency-Key` 必须是 UUID，并作为稳定 requestId。服务端据此派生稳定 planVersionId，
        在事务外编译输入，在短事务内写入 M19 DRAFT；同键同输入返回既有请求，同键不同输入返回 409。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequestInput'
      responses:
        '202':
          description: 新请求已保存并等待单 Worker 领取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRequestStatusResponse'
        '200':
          description: 同键同输入复用了既有请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRequestStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/aps/v1/plan-requests/{requestId}:
    get:
      tags: [plan-request]
      operationId: getPlanRequestStatusV1
      summary: 按稳定 requestId 查询计划请求状态
      description: |
        返回 M19 的持久化状态；`planStatus`、`solverStatus`、`resultKind` 和 `reasonCodes`
        必须按各自层级解释。断线后以本接口和 MySQL 为最终事实。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已存在请求的当前持久化状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRequestStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: requestId 不存在或调用者无权查看
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
  /api/aps/v1/plan-requests/{requestId}/cancel:
    post:
      tags: [plan-request]
      operationId: cancelPlanRequestV1
      summary: 取消待求解或求解中的计划请求
      description: 取消只改变候选请求状态，不改变当前正式计划；Worker 轮询取消并停止 CP-SAT 搜索。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 已取消，或该请求此前已经取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanRequestStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: requestId 不存在或调用者无权查看
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/aps/v1/plan-requests/{requestId}/events:
    get:
      tags: [plan-request]
      operationId: streamPlanRequestProgressV1
      summary: 订阅计划请求状态变化
      description: |
        SSE 只推送 MySQL 中可恢复的状态变化，不承载最终一致性。断线或超时后调用普通状态查询恢复；
        SSE 连接中断不会取消求解。事件名为 `plan-status`，终态发送后服务端结束连接。
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: 状态变化事件流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/PlanRequestProgressEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: requestId 不存在或调用者无权查看
          content:
            application/json:
              schema:
                $ref: '../schemas/problem-v1.schema.json'
  /api/aps/v1/plan-versions:
    get:
      tags: [plan-workbench]
      operationId: listPlanVersionsV1
      summary: 查询可见范围内最近的计划版本
      description: 需要 aps:planning:view；先按冻结输入中的全部车间范围过滤，再按版本号倒序取最近200项。不返回冻结输入或求解快照。旧版本可查看，派工仍由现有正式计划规则裁决。
      responses:
        '200':
          description: 可见计划集合；没有可见车间或计划时为空数组
          content:
            application/json:
              schema:
                type: array
                maxItems: 200
                items:
                  type: object
                  required: [planVersionId, versionNo, versionName, status, requestId, rowVersion, updatedAt]
                  properties:
                    planVersionId: {type: string, format: uuid}
                    versionNo: {type: integer, minimum: 1}
                    versionName: {type: string}
                    status: {type: string}
                    requestId: {type: string, format: uuid}
                    baseVersionId: {type: [string, 'null'], format: uuid}
                    rowVersion: {type: integer, minimum: 0}
                    updatedAt: {type: string, format: date-time}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/aps/v1/plan-versions/{planVersionId}:
    get:
      tags: [plan-workbench]
      operationId: getPlanVersionDetailV1
      summary: 查询工作台所需的计划版本完整只读详情
      description: 要求 `aps:planning:view`；返回 M19～M24 的作业、成员、分段、资源分配和锁，不返回可伪造的客户端基线输入。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
      responses:
        '200':
          description: 计划版本详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionDetailResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 版本不存在或调用者无权查看, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
  /api/aps/v1/plan-versions/{planVersionId}/comparison:
    get:
      tags: [plan-workbench]
      operationId: comparePlanVersionV1
      summary: 按稳定任务成员集合比较候选与基线
      description: 未传 `baseVersionId` 时使用目标版本的 M19 `base_version_id`；不以易变化的数据库作业 ID 作为跨版本身份。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
        - name: baseVersionId
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Uuid' }
      responses:
        '200':
          description: 作业级时间、资源、数量、类型和工作中心差异
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanVersionComparisonResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 任一版本不存在或调用者无权查看, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
  /api/aps/v1/plan-versions/{planVersionId}/locks:
    post:
      tags: [plan-workbench]
      operationId: createPlanLockV1
      summary: 在可行或冲突候选上创建人工计划锁
      description: 要求 `aps:planning:lock`。客户端只提交目标和意图；锁定时间与资源由服务端从 M20～M23 推导，正式版本禁止原地修改。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanLockRequest' }
      responses:
        '200':
          description: 已递增计划行版本并返回包含新锁的完整计划详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 版本或目标不存在, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/plan-versions/{planVersionId}/adjustments:
    post:
      tags: [plan-workbench]
      operationId: createPlanAdjustmentV1
      summary: 把甘特调整意图编译成新的求解版本
      description: 要求 `aps:planning:adjust`。原候选保持不可变；服务端按稳定对象映射生成新 M19 DRAFT、调整锁和影响闭包，同一 Idempotency-Key 可安全重试。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanAdjustmentRequest' }
      responses:
        '200':
          description: 同一调整意图的幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanAdjustmentAcceptedResponse' }
        '202':
          description: 新版本已进入异步求解队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanAdjustmentAcceptedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 基线候选或调整目标不存在, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/plan-versions/{planVersionId}/structural-adjustments:
    post:
      tags: [plan-workbench]
      operationId: createPlanStructuralAdjustmentV1
      summary: 基于当前正式计划创建插单、拆批或固定合批草稿
      description: |
        要求 `aps:planning:adjust`。只接受版本化意图，不修改 M20～M24 正式历史。插单和合批重新编译当前事实；
        拆批在同一 SERIALIZABLE 事务内完成 M15/M16 数量转移和新 M19 DRAFT，编译或写入失败时整体回滚。
        已开始任务禁止拆批或改变共享批成员；同一 Idempotency-Key 仅能绑定同一动作与参数。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePlanStructuralAdjustmentRequest' }
      responses:
        '200':
          description: 同一结构调整意图的幂等重放
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanStructuralAdjustmentAcceptedResponse' }
        '202':
          description: 新草稿已进入异步求解队列
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanStructuralAdjustmentAcceptedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 正式版本、订单或生产批不存在, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/plan-versions/{planVersionId}/publish:
    post:
      tags: [plan-workbench]
      operationId: publishPlanVersionV1
      summary: 独立复验并原子发布系统内正式计划
      description: 要求 `aps:planning:publish`。在 SERIALIZABLE 短事务中锁定候选与当前正式版本，复验输入摘要、事实更新时间、M20～M24 候选和基线链，再先废止旧正式版本并切换唯一当前指针。P0 不外发，因此明确返回 NOT_APPLICABLE。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishPlanRequest' }
      responses:
        '200':
          description: 系统内正式版本已经生效；重复发布当前版本安全复用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanPublishedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 版本不存在或调用者无权查看, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/plan-versions/{planVersionId}/discard:
    post:
      tags: [plan-workbench]
      operationId: discardPlanCandidateV1
      summary: 标记废弃可行或冲突候选并保留历史
      description: 要求 `aps:planning:cancel`。按 M19 rowVersion 并发控制把候选置为 CANCELLED 并记录原因；不删除 M19～M24，也不修改当前正式计划。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscardCandidateRequest' }
      responses:
        '200':
          description: 候选已标记废弃，完整历史仍可读取
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanCandidateDiscardedResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 版本不存在或调用者无权查看, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/plan-versions/{planVersionId}/locks/{lockId}:
    delete:
      tags: [plan-workbench]
      operationId: deletePlanLockV1
      summary: 按计划与锁的行版本删除人工计划锁
      description: 要求 `aps:planning:lock`。计划和锁任一版本过期都返回 409，不允许删除正式版本上的历史锁。
      parameters:
        - $ref: '#/components/parameters/PlanVersionId'
        - name: lockId
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: expectedPlanRowVersion
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RowVersion' }
        - name: expectedLockRowVersion
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RowVersion' }
      responses:
        '200':
          description: 已递增计划行版本并返回删除锁后的完整计划详情
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanVersionDetailResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 版本或锁不存在, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/execution-runs:
    get:
      tags:
      - execution
      operationId: listApsExecutionRunsV1
      summary: 按名称查询执行单
      description: 需要 aps:execution:view。先过滤完整冻结车间范围，再取最近200个，包含订单及工序名称。
      responses:
        '200':
          description: 业务回执；不代表业务验收通过
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApsRunOption'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
      - name: status
        in: query
        required: false
        schema:
          enum:
          - ''
          - READY
          - RUNNING
          - PAUSED
          - WAIT_QUALITY
          - COMPLETED
          - CANCELLED
      - name: resourceId
        in: query
        required: false
        schema:
          type: string
    post:
      tags: [execution]
      operationId: createExecutionRunV1
      summary: 从当时唯一当前正式计划作业创建执行 run
      description: 要求 `aps:execution:start`。同一作业最多一个非终态 run；旧正式版本不得新建 run。同一 Idempotency-Key 和载荷安全重放。
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateExecutionRunRequest' } } } }
      responses:
        '200': { description: 幂等复用已有 run, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '201': { description: 已创建 READY run, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/execution-runs/{executionRunId}:
    get:
      tags: [execution]
      operationId: getExecutionRunV1
      summary: 查询 run、实际占用、报工和产出批当前投影
      description: 要求 `aps:execution:view`。M28 数量来自 M29 事件链投影，不表示历史可原地编辑。
      parameters: [{ $ref: '#/components/parameters/ExecutionRunId' }]
      responses:
        '200': { description: 执行详情, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: run 不存在或调用者无权查看, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
  /api/aps/v1/execution-runs/{executionRunId}/transitions:
    post:
      tags: [execution]
      operationId: transitionExecutionRunV1
      summary: 按乐观版本执行开工、暂停、恢复或受控取消
      description: START/RESUME 要求 `aps:execution:start`，PAUSE/CANCEL 要求 `aps:execution:pause`。同一目标状态重试返回当前结果；迟到旧版本命令返回 409。
      parameters: [{ $ref: '#/components/parameters/ExecutionRunId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionTransitionRequest' } } } }
      responses:
        '200': { description: 转换完成或已处于同一目标状态, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: run 不存在, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/execution-runs/{executionRunId}/resource-changes:
    post:
      tags: [execution]
      operationId: changeExecutionResourceV1
      summary: 关闭当前实际占用并受控切换人员或设备
      description: 要求 `aps:execution:start`。服务端在同一事务重新校验技能、日历、状态和实际占用，关闭旧 M26 后打开新 M26。
      parameters:
        - $ref: '#/components/parameters/ExecutionRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionResourceChangeRequest' } } } }
      responses:
        '200': { description: 资源切换完成或幂等复用, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/execution-runs/{executionRunId}/phase-advances:
    post:
      tags: [execution]
      operationId: advanceExecutionPhaseV1
      summary: 原子关闭当前计划段并打开下一个计划段的真实资源占用
      description: 要求 `aps:execution:start`。仅 RUNNING run 可调用；每次自动推进到下一个 segment_no，run 保持 RUNNING。同一 Idempotency-Key 和载荷安全重放。
      parameters:
        - $ref: '#/components/parameters/ExecutionRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionPhaseAdvanceRequest' } } } }
      responses:
        '200': { description: 阶段推进完成或幂等复用, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: run 不存在, content: { application/json: { schema: { $ref: '../schemas/problem-v1.schema.json' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/execution-runs/{executionRunId}/reports:
    post:
      tags: [execution]
      operationId: createProductionReportV1
      summary: 提交部分或完工报工并原子生成产出批和数量事件
      description: 要求 `aps:execution:report`。M27、M28、M29 与 M25 执行水位在同一事务提交；同一 Idempotency-Key 不重复计量。COMPLETE 只允许在最后计划段提交。
      parameters:
        - $ref: '#/components/parameters/ExecutionRunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateProductionReportRequest' } } } }
      responses:
        '200': { description: 幂等复用已有报工, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '201': { description: 报工与数量链已原子提交, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/production-reports/{reportId}/corrections:
    post:
      tags: [execution]
      operationId: correctProductionReportV1
      summary: 追加替代快照、反向原事件并生成新的数量链
      description: 要求 `aps:execution:report`。原 M27/M28/M29 不修改、不删除；REVERSE 必须精确交换原事件起止桶并保持批、单位和数量一致。
      parameters:
        - $ref: '#/components/parameters/ProductionReportId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CorrectProductionReportRequest' } } } }
      responses:
        '200': { description: 幂等复用已有更正, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '201': { description: 更正和冲正链已原子提交, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/output-lots/{outputLotId}/quality-decisions:
    post:
      tags: [execution]
      operationId: decideOutputLotQualityV1
      summary: 对产出批执行隔离、放行、拒收、返工、报废或让步使用
      description: 要求 `aps:execution:quality`。待检/隔离不进入下游可用量；质量决定与 M29 事件、M28 投影和 M25 水位同事务提交。
      parameters:
        - $ref: '#/components/parameters/OutputLotId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QualityDecisionRequest' } } } }
      responses:
        '200': { description: 质量决定已提交或幂等复用, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/output-lots/{outputLotId}/quantity-movements:
    post:
      tags: [execution]
      operationId: moveOutputLotQuantityV1
      summary: 对已放行产出执行预留、取消预留、投入或转序
      description: 要求 `aps:execution:report`。M29 是数量真相；M28、M18 与 M25 执行水位在同一事务更新，投入必须绑定执行目标任务的 run。
      parameters:
        - $ref: '#/components/parameters/OutputLotId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QuantityMovementRequest' } } } }
      responses:
        '200': { description: 数量流转已提交或幂等复用, content: { application/json: { schema: { $ref: '#/components/schemas/ExecutionRunDetailResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/aps/v1/reports/daily-production:
    get:
      tags: [report]
      operationId: getDailyProductionReportV1
      summary: 查询车间每日生产表
      description: 要求 `aps:report:view`；首个当日发布版本作为冻结分母，当前计划与实际事实独立展示，数量不跨 UOM 合计。
      parameters:
        - { name: businessDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: workshopId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: workCenterId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: 日报, content: { application/json: { schema: { $ref: '#/components/schemas/DailyProductionReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/reports/daily-production.csv:
    get:
      tags: [report]
      operationId: exportDailyProductionReportV1
      summary: 按相同范围导出车间每日生产 CSV
      description: 要求 `aps:report:export`；响应受同一数据范围裁剪并记录导出审计。
      parameters:
        - { name: businessDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: workshopId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: workCenterId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
      responses:
        '200': { description: UTF-8 BOM CSV, content: { text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/reports/labor-capacity:
    get:
      tags: [report]
      operationId: getLaborCapacityReportV1
      summary: 查询人员去重的累计产能和分技能峰值
      parameters:
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: workshopId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: workCenterId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: skillCode, in: query, schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.:-]+$' } }
      responses:
        '200': { description: 累计人力产能, content: { application/json: { schema: { $ref: '#/components/schemas/LaborCapacityReport' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/reports/labor-capacity.csv:
    get:
      tags: [report]
      operationId: exportLaborCapacityReportV1
      summary: 按相同范围导出累计人力产能 CSV
      parameters:
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: workshopId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: workCenterId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: skillCode, in: query, schema: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9_.:-]+$' } }
      responses:
        '200': { description: UTF-8 BOM CSV, content: { text/csv: { schema: { type: string } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/aps/v1/reports/order-delivery:
    get:

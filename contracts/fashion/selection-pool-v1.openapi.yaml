      summary: 同步生成提案交付
      tags:
      - proposal
      description: 同owner/requestKey及同内容复用记录，内容冲突409。同步生成1～100套、嵌入图不超过50MB，冻结当次顺序、价格、图片和版本；失败保留记录不提供文件。
      x-ruoyi-permissions:
      - fashion:quote:export

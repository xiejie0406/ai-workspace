          type: integer
          format: int64
          minimum: 1
        groupPrice:
          $ref: '#/components/schemas/Money'
        vipPrice:
          $ref: '#/components/schemas/Money'
      required:
      - rowVersion
      description: 两个字段独立赋值，省略或null清空该价；非负，整数最多14位，小数最多2位。使用目录写锁、事务与商品版本CAS。
    CommercialPriceChange:
      allOf:
      - $ref: '#/components/schemas/CommercialPrice'
      - type: object
        properties:
          previous:
            $ref: '#/components/schemas/CommercialPrice'
        required:
        - previous
    PoolOptions:
      type: object
      properties:

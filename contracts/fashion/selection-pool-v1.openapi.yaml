    Selection:
      type: object
      properties:
        poolId:
          type: string
          description: 请求中忽略此值，以路径池 ID 为准；响应为真实池 ID。
        rowVersion:
          type: integer
          format: int64
          minimum: 0
          description: 未保存版本为0，保存成功递增；提交旧版拒绝覆盖。
        all:
          type: boolean
          default: false
          description: 整个不可变池的有效结果全选，不是当前页或关键词范围。
        selectedIds:
          type: array
          items:
            $ref: '#/components/schemas/CombinationId'
          maxItems: 100000
        excludedIds:
          type: array
          items:
            $ref: '#/components/schemas/CombinationId'
          maxItems: 100000
        names:
          type: object
          maxProperties: 1000
          additionalProperties:
            type: string
            maxLength: 200
        orderedIds:
          type: array
          items:
            $ref: '#/components/schemas/CombinationId'
          maxItems: 100000
        variantSelections:
          type: object
          maxProperties: 1000
          additionalProperties:
            type: object
            additionalProperties:
              $ref: '#/components/schemas/Id'
          description: 组合ID→主SKU key→实际 productId；服务端验证所属关系。
      required:
      - rowVersion
      description: 缺省列表/map按空处理。排除项优先；orderedIds 先排序，未指定部分按稳定组合ID排序。输入身份全部须属于此池。
    CommercialPrice:
      type: object
      properties:
        productId:
          $ref: '#/components/schemas/Id'
        rowVersion:
          type: integer
          format: int64
        groupPrice:
          $ref: '#/components/schemas/Money'
        vipPrice:
          $ref: '#/components/schemas/Money'

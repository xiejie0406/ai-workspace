              path:
                type: string
            required:
            - code
            - path
        brands:
          type: array
          items:
            type: string
        seasons:
          type: array
          items:
            type: string
        genders:
          type: array
          items:
            type: string
        warehouses:
          type: array
          items:
            type: string
      required:
      - categories
      - brands
      - seasons
      - genders
      - warehouses
    ImageRef:
      type: object
      properties:
        objectKey:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - objectKey
      - sha256
    ExportRequest:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
        combinationIds:
          type: array
          items:
            $ref: '#/components/schemas/CombinationId'
          uniqueItems: true
        priceMode:
          type: string
          enum:
          - none
          - group
          - vip
          default: none
        imageMode:
          type: string
          enum:
          - original
          - model
          default: original
        adoptedTaskIds:
          type: object
          additionalProperties:
            type: string
          description: 组合ID→已采用且未过期任务ID；model模式每个导出组合必须提供。
      required:
      - rowVersion
      description: combinationIds空或省略表示全部已选；非空必须是已选子集。顺序沿用已选清单，非请求数组顺序。有效范围每文件1～100套，超限拒绝，客户端分批。选品提案不等于正式报价。
    Preflight:
      type: object
      properties:
        ready:
          type: boolean
        issues:
          type: array
          items:
            type: string
        combinationCount:
          type: integer
          format: int64
        maxPerFile:
          type: integer
          format: int64
          enum:
          - 100
      required:
      - ready
      - issues
      - combinationCount
      - maxPerFile
      description: 素材/价格等问题返回ready=false、第一条问题和combinationCount=0。所属权限或草稿版本异常直接失败，不转成预检信息。
    TryOnRequest:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
          description: 已选草稿版本
        combinationId:
          $ref: '#/components/schemas/CombinationId'
        model:
          $ref: '#/components/schemas/ImageRef'
        requestKey:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,100}$
      required:
      - rowVersion
      - combinationId
      - model
      - requestKey
      description: 只能针对已选组合。模型必须为当前账号经/models上传的素材。相同owner+requestKey且同输入复用原任务；冲突code409。Provider不可用code503且不创建任务。一次请求对应一套方案，批量由调用方逐套提交。
    TaskVersion:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
          description: 试衣任务版本，区别于已选草稿版本
      required:
      - rowVersion
    ReviewRequest:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
        resultNo:
          type: integer
          format: int64
          minimum: 0
        adopt:
          type: boolean
        checks:
          type: object
          properties:
            style:
              type: boolean
            color:
              type: boolean
            completeness:
              type: boolean
            quality:
              type: boolean
        reason:
          type: string
      required:
      - rowVersion
      - resultNo
      - adopt
      description: 采用时四个checks全部true；拒绝时reason非空。仅review/adopted/rejected且未过期任务可复核。resultNo从0开始。
    ImageResult:
      type: object
      properties:
        status:
          type: string
        object_key:
          type: string
        sha256:
          type: string
        error_message:
          type:
          - string
          - 'null'
      description: Provider结果JSON透传，额外字段允许；成功项含status=success、object_key和sha256。
    ImageTask:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - submitting
          - queued
          - running
          - unknown
          - cancel_requested
          - cancelled
          - review
          - adopted
          - rejected
          - failed
        rowVersion:
          type: integer
          format: int64
        draftVersion:
          type: integer
          format: int64
        combinationId:
          $ref: '#/components/schemas/CombinationId'
        inputHash:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/ImageResult'
        errorMessage:
          type:
          - string
          - 'null'
        review:
          type: object
          additionalProperties: true
        stale:
          type: boolean
      required:
      - id
      - status
      - rowVersion
      - draftVersion
      - combinationId
      - inputHash
      - results
      - review
      - stale
    ImageWorkspace:
      type: object
      properties:
        providerAvailable:
          type: boolean
        blockedReason:
          type: string
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/ImageTask'
      required:
      - providerAvailable
      - blockedReason
      - tasks
    AjaxError:
      type: object
      properties:
        code:
          type: integer
          not:
            const: 200
          examples:
          - 401
          - 403
          - 409
          - 500
          - 503
        msg:
          type: string
        data: {}
      required:
      - code
      - msg
      description: RuoYi业务错误信封。GlobalExceptionHandler/认证入口通常HTTP200，必须检查code，不能仅检查HTTP状态。普通ServiceException为500；Proposal部分冲突为409、Provider不可用503；未认证401/无权限403同样可能HTTP200。

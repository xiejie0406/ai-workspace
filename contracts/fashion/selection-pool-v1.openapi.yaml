        objectKey:
          type: string
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - objectKey
      - sha256
    ExportRequest:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
        combinationIds:
          type: array
          items:
            $ref: '#/components/schemas/CombinationId'
          uniqueItems: true
        priceMode:
          type: string
          enum:
          - none
          - group
          - vip
          default: none
        imageMode:
          type: string
          enum:
          - original
          - model
          default: original
        adoptedTaskIds:
          type: object
          additionalProperties:
            type: string
          description: 组合ID→已采用且未过期任务ID；model模式每个导出组合必须提供。
      required:
      - rowVersion
      description: combinationIds空或省略表示全部已选；非空必须是已选子集。顺序沿用已选清单，非请求数组顺序。有效范围每文件1～100套，超限拒绝，客户端分批。选品提案不等于正式报价。

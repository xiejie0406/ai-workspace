          - string
          - 'null'
        originalFilename:
          type:
          - string
          - 'null'
        capturedAt:
          type:
          - string
          - 'null'
          format: date-time
        confirmedAt:
          type:
          - string
          - 'null'
          format: date-time
        allowInternal:

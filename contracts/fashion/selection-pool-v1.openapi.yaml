        allowAi:
          type: boolean
        allowProposal:
          type: boolean
        allowEcommerce:
          type: boolean
        status:
          type: string
        confirmedBy:
          type:
          - integer
          - 'null'
          format: int64
        width:
          type: integer
          format: int64
        height:
          type: integer
          format: int64
      description: 当前商品素材记录；引用不是公开下载地址，授权及摘要须由服务端复核。
    Variant:
      type: object
      properties:

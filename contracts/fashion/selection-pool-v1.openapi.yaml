          maxItems: 4
        stockUnknown:
          type: boolean
        currency:
          type:
          - string
          - 'null'
        taxMode:
          type:
          - string
          - 'null'
        groupPriceMin:
          $ref: '#/components/schemas/Money'
        groupPriceMax:
          $ref: '#/components/schemas/Money'
        vipPriceMin:
          $ref: '#/components/schemas/Money'
        vipPriceMax:
          $ref: '#/components/schemas/Money'
        availableSets:
          type:
          - integer
          - 'null'
          minimum: 0
          description: 全部位置有效库存的最小floor(qty/unitsPerSet)，未知保持null
        meetsDemand:
          type:
          - boolean
          - 'null'
          description: >-
            需求满足三态：true表示每个位置有效库存至少满足每套1件/双，false表示某位置明确有效库存不足（即使其他位置未知），null表示库存未知而无法判断。
            未指定quantity仍按每套1件/双判断，不将未知或部分未知库存的局部合计当成满足或不足；显式quantity为硬筛选，库存未知或不足的组合不进入结果。旧快照缺此字段按待核实处理。

      type: object
      properties:
        ready:
          type: boolean
        issues:
          type: array
          items:
            type: string
        combinationCount:
          type: integer
          format: int64
        maxPerFile:
          type: integer
          format: int64
          enum:
          - 100
      required:
      - ready
      - issues
      - combinationCount
      - maxPerFile
      description: 素材/价格等问题返回ready=false、第一条问题和combinationCount=0。所属权限或草稿版本异常直接失败，不转成预检信息。
    TryOnRequest:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
          description: 已选草稿版本
        combinationId:
          $ref: '#/components/schemas/CombinationId'
        model:
          $ref: '#/components/schemas/ImageRef'
        requestKey:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,100}$
        garmentPositions:
          type: object
          additionalProperties:
            type: string
            enum:
            - top
            - bottom
            - dress
            - original
          description: 主SKU key→服装位置；配件original只保留原图，不送试衣。不能同时dress和top/bottom
        maxCost:
          type: number
          minimum: 0
          description: 单套本次费用上限，须不低于当前服务端估计费用
        costConfirmed:
          type: boolean
          const: true
          description: 本次付费明确确认
      required:
      - rowVersion
      - combinationId
      - model
      - requestKey
      - garmentPositions
      - maxCost
      - costConfirmed
      description: 只能针对已选组合。模型必须为当前账号经/models上传的素材。相同owner+requestKey且同输入复用原任务；冲突code409。Provider不可用code503且不创建任务。一次请求对应一套方案，批量由调用方逐套提交。
        位置显式确认；阿里云仅上装/下装/连衣裙。未知提交且无taskId不自动重提交，需人工对账。 月度预算包含未知实扣任务的估计费用预留；超额不提交。自动恢复最长24小时，超过期限或连续查询失败8次停止自动查询，保留原任务并人工对账。
    TaskVersion:
      type: object
      properties:
        rowVersion:
          type: integer
          format: int64
          minimum: 1
          description: 试衣任务版本，区别于已选草稿版本

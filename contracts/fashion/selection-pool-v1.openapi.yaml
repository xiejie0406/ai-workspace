          description: PPTX文件或业务错误信封，下载端核对文件格式。
          content:
            application/vnd.openxmlformats-officedocument.presentationml.presentation:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/AjaxError'
        default:
          $ref: '#/components/responses/TransportError'
      operationId: getFashionProposalDeliveriesIdDownload
  /fashion/provider-media:
    get:
      summary: 试衣供应商临时读取已核实私有素材
      tags:
      - proposal
      security: []
      description: 公网HTTPS入口与32字节以上密钥未配置时关闭；仅材料原图与本账号模特图白名单、HMAC签名、1～30分钟过期校验，不提供列举或长期公开地址。 签名绑定已持久化任务；每次读取按该任务实际所选SKU重查active/allowAi、视觉版本及摘要，拒绝用同图其他SKU许可替代；模特素材需匹配本次任务拥有者及引用。
      parameters:
      - name: key
        in: query
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - name: task
        in: query
        required: true
        schema:
          type: string
          format: uuid
        description: 签名绑定的Java试衣任务ID，不能替换或省略
      responses:
        '200':
          description: 已核实图像，no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/TransportError'
      operationId: getFashionProviderMedia

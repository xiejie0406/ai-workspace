      tags:
      - proposal
      description: 复核owner、导出权限、私有文件摘要、大小和当前素材许可。冻结文件不被新草稿改写；撤回模特图采用或许可撤销后拒绝再次下载。成功提供PPTX并增加下载计数。
      x-ruoyi-permissions:
      - fashion:quote:export

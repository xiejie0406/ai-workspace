          enum:
          - group
          - vip
          default: group
        totalMin:
          $ref: '#/components/schemas/Money'
        totalMax:
          $ref: '#/components/schemas/Money'
      required:
      - groups
      description: 未给 title 使用新套装方案；未给 priceBasis 按团购价预算验证。创建不可变商品候选快照；返回原始数量和排重、币税与预算验证后的精确数量。
    ProductImage:
